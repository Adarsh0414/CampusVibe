<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Tickets - CampusVibe</title>
  <meta name="description" content="View and manage your registered event tickets on CampusVibe." />
  <meta name="keywords" content="CampusVibe my tickets" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://campusvibe-pu3g.onrender.com/my-tickets.html" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CampusVibe" />
  <meta property="og:title" content="My Tickets - CampusVibe" />
  <meta property="og:description" content="View and manage your registered event tickets on CampusVibe." />
  <meta property="og:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />
  <meta property="og:url" content="https://campusvibe-pu3g.onrender.com/my-tickets.html" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="My Tickets - CampusVibe" />
  <meta name="twitter:description" content="View and manage your registered event tickets on CampusVibe." />
  <meta name="twitter:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />

  <link rel="stylesheet" href="/assets/css/styles.css" />
  <meta name="theme-color" content="#10d9a0" />
  <script src="/assets/js/lottie.min.js"></script>
  <script src="/assets/i18n/i18n-data.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <style>
    .tickets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    @media (max-width: 760px) { .tickets-grid { grid-template-columns: 1fr; } }

    .ticket-card {
      background: rgba(8,14,38,0.78);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 0;
      overflow: hidden;
      transition: all var(--t-slow);
      position: relative;
    }
    .ticket-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md), var(--shadow-glow); border-color: var(--border-2); }

    .tc-stripe {
      height: 5px;
      background: linear-gradient(90deg, var(--primary-2), var(--accent));
    }
    .tc-stripe.paid     { background: linear-gradient(90deg, var(--success-2), var(--success)); }
    .tc-stripe.pending  { background: linear-gradient(90deg, #d97706, var(--warning)); }
    .tc-stripe.rejected { background: linear-gradient(90deg, var(--danger-2), var(--danger)); }

    .tc-body { padding: 20px; }
    .tc-event { font-family:'Space Grotesk',sans-serif; font-size:1.05rem; font-weight:700; color:var(--fg); margin-bottom:6px; line-height:1.3; }
    .tc-id { font-size:0.78rem; color:var(--muted); font-family:monospace; margin-bottom:10px; }
    .tc-date { display:flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--muted); margin:4px 0; }
    .tc-actions { display:flex; gap:8px; margin-top:16px; }
    .tc-actions a { flex:1; text-align:center; }
  </style>
</head>
<body>
  <header class="cv-header glass">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/assets/img/logo.svg" class="logo" alt="CampusVibe" />
        <div class="brand-text">
          <h1>CampusVibe</h1>
          <p class="tagline">Ideal Management, Ideal Moments</p>
        </div>
      </a>
      <nav class="nav">
        <a href="/" class="nav-link"><span data-i18n="nav_home">Home</span></a>
        <a href="/profile.html" class="nav-link"><span data-i18n="nav_profile">Profile</span></a>
        <a href="/faq.html" class="nav-link"><span data-i18n="nav_help">Help</span></a>
        <span data-i18n-mount></span>
        <a href="#" id="logoutBtn" class="btn outline sm"><span data-i18n="nav_logout">Logout</span></a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 40px 0 80px;">
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:8px;">
      <h2 style="font-family:'Space Grotesk',sans-serif; font-size:1.8rem; font-weight:800; background:linear-gradient(135deg,#fff 40%,var(--primary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin:0;">
        🎫 My Tickets
      </h2>
      <span class="badge primary" id="ticketCount" style="font-size:0.8rem;"></span>
    </div>
    <p class="muted" style="margin-bottom:32px; font-size:0.9rem;">All your event registrations in one place.</p>

    <div id="lottie-myt" style="height:100px; opacity:.4; margin-bottom:20px; pointer-events:none;"></div>

    <div id="root" class="tickets-grid">
      <div class="ticket-card skeleton" style="height:200px;"></div>
      <div class="ticket-card skeleton" style="height:200px;"></div>
      <div class="ticket-card skeleton" style="height:200px;"></div>
    </div>
  </main>

  <footer class="cv-footer">
    <div class="container">
      <p>© <span id="year"></span> CampusVibe — Ideal Management, Ideal Moments</p>
      <div style="margin-top:8px;"><a href="/">Browse Events</a></div>
    </div>
  </footer>

  <script>
  document.getElementById('year').textContent = new Date().getFullYear();

  async function loadTickets() {
    const root    = document.getElementById('root');
    const countEl = document.getElementById('ticketCount');

    root.innerHTML = `
      <div class="ticket-card skeleton" style="height:200px;"></div>
      <div class="ticket-card skeleton" style="height:200px;"></div>
      <div class="ticket-card skeleton" style="height:200px;"></div>
    `;

    try {
      const res = await fetch('/api/my-tickets', { credentials: 'include' });
      if (res.status === 401) { location.href = '/login.html'; return; }
      const { tickets = [] } = await res.json();

      countEl.textContent = `${tickets.length} ticket${tickets.length !== 1 ? 's' : ''}`;

      if (!tickets.length) {
        root.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div style="font-size:3.5rem; margin-bottom:16px;">🎟️</div>
            <h3>No tickets yet</h3>
            <p>Browse events and register to get your first ticket!</p>
            <a href="/" class="btn primary" style="margin-top:20px;">🎉 Browse Events</a>
          </div>
        `;
        return;
      }

      root.innerHTML = tickets.map((t, i) => {
        const status    = (t.payment_status || 'unpaid').toLowerCase();
        const stripeClass = status === 'paid' ? 'paid' : status === 'pending' ? 'pending' : (status === 'rejected' || status === 'expired') ? 'rejected' : '';

        const statusHtml =
          status === 'paid'
            ? '<span class="status-badge success">✅ Confirmed</span>'
          : status === 'pending'
            ? '<span class="status-badge pending">⏳ Awaiting Verification</span>'
          : status === 'rejected'
            ? '<span class="status-badge error">❌ Payment Rejected</span>'
          : status === 'expired'
            ? '<span class="status-badge error">⏰ Registration Expired</span>'
          : t.checked_in
            ? '<span class="status-badge success">🎫 Checked In</span>'
            : '<span class="status-badge pending">💳 Payment Required</span>';

        const dateStr = t.start_time
          ? new Date(t.start_time).toLocaleString('en-IN', {
              weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
            })
          : '—';

        // Unpaid/rejected registrations can still complete payment; expired
        // ones can only start over from the event page.
        const needsPayment = status === 'unpaid' || status === 'rejected';
        const actionsHtml = status === 'expired'
          ? `
              <a class="btn outline sm" href="/event.html?e=${t.event_uuid}">🔁 Register Again</a>
            `
          : `
              <a class="btn outline sm" href="/event.html?e=${t.event_uuid}">📋 Event</a>
              ${needsPayment
                ? `<a class="btn primary sm" href="/payment.html?e=${t.event_uuid}&t=${t.uuid}">💳 Complete Payment</a>`
                : `<a class="btn primary sm" href="/ticket.html?t=${t.uuid}">🎫 View Ticket</a>`
              }
            `;

        const countdownHtml = (status === 'unpaid' && t.hold_expires_at)
          ? `<div class="tc-countdown" data-expires="${t.hold_expires_at}" style="margin:6px 0; font-size:.78rem; color:var(--warning);"></div>`
          : '';

        return `
          <div class="ticket-card appear" style="animation-delay:${i*70}ms;">
            <div class="tc-stripe ${stripeClass}"></div>
            <div class="tc-body">
              <div class="tc-event">${esc(t.event_title)}</div>
              <div class="tc-id">Ticket #${String(t.ticket_number || 0).padStart(6, '0')}</div>
              <div class="tc-date">📅 ${dateStr}</div>
              ${t.location ? `<div class="tc-date">📍 ${esc(t.location)}</div>` : ''}
              <div style="margin:10px 0;">${statusHtml}</div>
              ${countdownHtml}
              <div class="tc-actions">
                ${actionsHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');

      startHoldCountdowns();

    } catch (err) {
      root.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <h3>Failed to load tickets</h3>
          <p>Please check your connection and try again.</p>
          <button class="btn primary" onclick="loadTickets()" style="margin-top:20px;">Retry</button>
        </div>
      `;
    }
  }

  let holdCountdownTimer = null;
  function startHoldCountdowns() {
    clearInterval(holdCountdownTimer);
    const els = document.querySelectorAll('.tc-countdown[data-expires]');
    if (!els.length) return;

    function tick() {
      let anyLive = false;
      els.forEach(el => {
        const msLeft = new Date(el.dataset.expires).getTime() - Date.now();
        if (msLeft <= 0) {
          el.textContent = '⏰ Seat hold expired — refresh to update';
          return;
        }
        anyLive = true;
        const totalSeconds = Math.floor(msLeft / 1000);
        const mm = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const ss = String(totalSeconds % 60).padStart(2, '0');
        el.textContent = `⏰ Seat held for ${mm}:${ss} — complete payment before it's released`;
      });
      if (!anyLive) clearInterval(holdCountdownTimer);
    }

    tick();
    holdCountdownTimer = setInterval(tick, 1000);
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadTickets();

    try {
      if (window.lottie) {
        window.lottie.loadAnimation({
          container: document.getElementById('lottie-myt'),
          renderer: 'svg', loop: true, autoplay: true,
          path: '/assets/lottie/ticket.json'
        });
      }
    } catch (e) {}

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
      location.href = '/';
    });
  });
  </script>
  <script src="/assets/js/chatbot.js"></script>
</body>
</html>
