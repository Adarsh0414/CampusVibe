  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="My Tickets - CampusVibe" />
  <meta name="twitter:description" content="View and manage your registered event tickets on CampusVibe." />
  <meta name="twitter:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />

  <!-- Item 4 (Part 16): Space Grotesk was previously loaded via an
       @import inside styles.css placed after other rules — invalid
       per the CSS spec (an @import must precede all other rules), so
       browsers silently ignored it and the custom display font never
       actually loaded. Moved to a real <link>, discoverable by the
       preload scanner in parallel with styles.css instead of only
       after it finishes downloading and parsing; preconnect warms the
       cross-origin connection early. display=swap (kept from the
       original URL) means body text never waits invisibly on it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <meta name="theme-color" content="#10d9a0" />
  <script src="/assets/js/lottie.min.js" defer></script>
  <script src="/assets/i18n/i18n-data.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/loading.js"></script>
  <style>
    .tickets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    @media (max-width: 760px) { .tickets-grid { grid-template-columns: 1fr; } }

    .ticket-card {
      background: rgba(8,14,38,0.78);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 0;
      overflow: hidden;
      transition: all var(--t-slow);
      position: relative;
    }
    .ticket-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md), var(--shadow-glow); border-color: var(--border-2); }

    .tc-stripe {
      height: 5px;
      background: linear-gradient(90deg, var(--primary-2), var(--accent));
    }
    .tc-stripe.paid     { background: linear-gradient(90deg, var(--success-2), var(--success)); }
    .tc-stripe.pending  { background: linear-gradient(90deg, #d97706, var(--warning)); }
    .tc-stripe.rejected { background: linear-gradient(90deg, var(--danger-2), var(--danger)); }

    .tc-body { padding: 20px; }
    .tc-event { font-family:'Space Grotesk',sans-serif; font-size:1.05rem; font-weight:700; color:var(--fg); margin-bottom:6px; line-height:1.3; }
    .tc-id { font-size:0.78rem; color:var(--muted); font-family:monospace; margin-bottom:10px; }
    .tc-date { display:flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--muted); margin:4px 0; }
    .tc-actions { display:flex; gap:8px; margin-top:16px; }
    .tc-actions a { flex:1; text-align:center; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="cv-header glass">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/assets/img/logo.svg" class="logo" alt="" />
        <div class="brand-text">
          <h1>CampusVibe</h1>
          <p class="tagline">Ideal Management, Ideal Moments</p>
        </div>
      </a>
      <nav class="nav">
        <a href="/" class="nav-link"><span data-i18n="nav_home">Home</span></a>
        <a href="/profile.html" class="nav-link"><span data-i18n="nav_profile">Profile</span></a>
        <a href="/faq.html" class="nav-link"><span data-i18n="nav_help">Help</span></a>
        <span data-i18n-mount></span>
        <a href="#" id="logoutBtn" class="btn outline sm"><span data-i18n="nav_logout">Logout</span></a>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="container" style="padding: 40px 0 80px;">
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:8px;">
      <h2 style="font-family:'Space Grotesk',sans-serif; font-size:1.8rem; font-weight:800; background:linear-gradient(135deg,#fff 40%,var(--primary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin:0;">
        🎫 My Tickets
      </h2>
      <span class="badge primary" id="ticketCount" style="font-size:0.8rem;"></span>
    </div>
    <p class="muted" style="margin-bottom:32px; font-size:0.9rem;">All your event registrations in one place.</p>

    <div id="lottie-myt" style="height:100px; opacity:.4; margin-bottom:20px; pointer-events:none;"></div>

    <div id="root" class="tickets-grid">
      <div class="ticket-card skeleton" style="height:200px;"></div>
      <div class="ticket-card skeleton" style="height:200px;"></div>
      <div class="ticket-card skeleton" style="height:200px;"></div>
    </div>

    <!-- The visible per-second countdown text (.tc-countdown, below) is
         intentionally NOT a live region — announcing "05:59, 05:58, 05:57..."
         every second would be unusable noise for screen-reader users. This
         hidden region instead announces once, only when a hold actually
         expires, which is the one transition in the countdown that matters. -->
    <div id="holdExpiryAnnounce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>

  <footer class="cv-footer">
    <div class="container">
      <p>© <span id="year"></span> CampusVibe — Ideal Management, Ideal Moments</p>
      <div style="margin-top:8px;"><a href="/">Browse Events</a></div>
    </div>
  </footer>

  <script>
  document.getElementById('year').textContent = new Date().getFullYear();

  async function loadTickets() {
    const root    = document.getElementById('root');
    const countEl = document.getElementById('ticketCount');

    // Offline/recovery (Part 13, item 21): my-tickets is a personal,
    // read-heavy view a student may reopen on a flaky connection (e.g.
    // checking a ticket right before an event, on venue wifi) — exactly
    // the kind of view worth surviving a dead network for, same reasoning
    // as the homepage default view and event details (LOADING_STATES.md
    // §5). A saved copy paints instantly (clearly marked stale), a
    // background refresh always runs, and a failed refresh degrades to
    // "showing saved tickets" instead of wiping what's already on screen.
    // Cache lives in sessionStorage and is wiped on logout by the existing
    // CVLoading.clearCache() call, so it can't leak between users on a
    // shared browser tab. Never used for anything state-changing — the
    // actual payment/registration actions this page links out to always
    // require a live request.
    const cacheKey = 'tickets:mine';
    const cached = window.CVLoading ? window.CVLoading.cacheGet(cacheKey) : null;

    if (cached) {
      renderTickets(root, countEl, cached.data.tickets || [], { stale: true });
    } else {
      root.setAttribute('aria-busy', 'true');
      root.innerHTML = `
        <div class="ticket-card skeleton" style="height:200px;"></div>
        <div class="ticket-card skeleton" style="height:200px;"></div>
        <div class="ticket-card skeleton" style="height:200px;"></div>
      `;
    }

    const doFetch = async () => {
      const res = window.CVLoading
        ? await window.CVLoading.fetchWithTimeout('/api/my-tickets', { credentials: 'include' }, 12000)
        : await fetch('/api/my-tickets', { credentials: 'include' });
      if (res.status === 401) {
        const err = new Error('unauthenticated');
        err.isAuthRedirect = true;
        location.href = '/login.html';
        throw err;
      }
      if (!res.ok) throw new Error('Failed to load tickets (' + res.status + ')');
      return res.json();
    };

    const onSuccess = (data) => {
      root.removeAttribute('aria-busy');
      renderTickets(root, countEl, data.tickets || [], { stale: false });
    };

    const onFail = (hadCache, err) => {
      if (err && err.isAuthRedirect) return; // already navigating to /login.html
      root.removeAttribute('aria-busy');
      if (hadCache) {
        // Real content is already painted (from cache) — don't blow it
        // away for a background refresh failure, just be honest about it.
        window.CVLoading?.showBanner("You're offline — showing saved tickets from earlier.", 'cached');
        return;
      }
      const timedOut = err && err.isTimeout;
      root.innerHTML = `
        <div class="error-state" role="alert" style="grid-column:1/-1;">
          <div class="icon" aria-hidden="true">${timedOut ? '⏳' : '📡'}</div>
          <h3>${timedOut ? 'Still loading…' : 'Failed to load tickets'}</h3>
          <p class="muted">${timedOut ? 'The connection seems slow. You can try again.' : 'Please check your connection and try again.'}</p>
          <button class="btn primary" id="retryTicketsBtn" onclick="loadTickets()" style="margin-top:20px;">Retry</button>
        </div>
      `;
      // ✅ Item 15 (Part 21): only reached when there's no cached copy to
      // fall back to (see `hadCache` branch above), i.e. the grid really is
      // empty of anything else focus could usefully land on — move it to Retry.
      window.CVLoading?.focusErrorState(document.getElementById('retryTicketsBtn'));
    };

    if (window.CVLoading) {
      await window.CVLoading.staleWhileRevalidate(cacheKey, doFetch, {
        onFresh: onSuccess,
        onOffline: () => onFail(true),
        onError: (err) => onFail(false, err),
      });
    } else {
      try { onSuccess(await doFetch()); } catch (err) { onFail(false, err); }
    }
  }

  function renderTickets(root, countEl, tickets, { stale = false } = {}) {
      root.classList.toggle('is-stale-data', stale);
      countEl.textContent = `${tickets.length} ticket${tickets.length !== 1 ? 's' : ''}`;

      if (!tickets.length) {
        root.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div style="font-size:3.5rem; margin-bottom:16px;" aria-hidden="true">🎟️</div>
            <h3>No tickets yet</h3>
            <p>Browse events and register to get your first ticket!</p>
            <a href="/" class="btn primary" style="margin-top:20px;"><span aria-hidden="true">🎉</span> Browse Events</a>
          </div>
        `;
        return;
      }

      root.innerHTML = tickets.map((t, i) => {
        const status    = (t.payment_status || 'unpaid').toLowerCase();
        const stripeClass = status === 'paid' ? 'paid' : status === 'pending' ? 'pending' : (status === 'rejected' || status === 'expired') ? 'rejected' : '';

        const statusHtml =
          status === 'paid'
            ? '<span class="status-badge success"><span aria-hidden="true">✅</span> Confirmed</span>'
          : status === 'pending'
            ? '<span class="status-badge pending">⏳ Awaiting Verification</span>'
          : status === 'rejected'
            ? '<span class="status-badge error"><span aria-hidden="true">❌</span> Payment Rejected</span>'
          : status === 'expired'
            ? '<span class="status-badge error">⏰ Registration Expired</span>'
          : t.checked_in
            ? '<span class="status-badge success"><span aria-hidden="true">🎫</span> Checked In</span>'
            : '<span class="status-badge pending"><span aria-hidden="true">💳</span> Payment Required</span>';

        const dateStr = t.start_time
          ? new Date(t.start_time).toLocaleString('en-IN', {
              weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
            })
          : '—';

        // Unpaid/rejected registrations can still complete payment; expired
        // ones can only start over from the event page.
        const needsPayment = status === 'unpaid' || status === 'rejected';
        const actionsHtml = status === 'expired'
          ? `
              <a class="btn outline sm" href="/event.html?e=${t.event_uuid}"><span aria-hidden="true">🔁</span> Register Again</a>
            `
          : `
              <a class="btn outline sm" href="/event.html?e=${t.event_uuid}"><span aria-hidden="true">📋</span> Event</a>
              ${needsPayment
                ? `<a class="btn primary sm" href="/payment.html?e=${t.event_uuid}&t=${t.uuid}"><span aria-hidden="true">💳</span> Complete Payment</a>`
                : `<a class="btn primary sm" href="/ticket.html?t=${t.uuid}"><span aria-hidden="true">🎫</span> View Ticket</a>`
              }
            `;

        const countdownHtml = (status === 'unpaid' && t.hold_expires_at)
          ? `<div class="tc-countdown" data-expires="${t.hold_expires_at}" style="margin:6px 0; font-size:.78rem; color:var(--warning);"></div>`
          : '';

        return `
          <div class="ticket-card appear" style="animation-delay:${i*70}ms;">
            <div class="tc-stripe ${stripeClass}"></div>
            <div class="tc-body">
              <div class="tc-event">${esc(t.event_title)}</div>
              <div class="tc-id">Ticket #${String(t.ticket_number || 0).padStart(6, '0')}</div>
              <div class="tc-date"><span aria-hidden="true">📅</span> ${dateStr}</div>
              ${t.location ? `<div class="tc-date"><span aria-hidden="true">📍</span> ${esc(t.location)}</div>` : ''}
              <div style="margin:10px 0;">${statusHtml}</div>
              ${countdownHtml}
              <div class="tc-actions">
                ${actionsHtml}
              </div>
            </div>
          </div>
        `;
      }).join('');

      startHoldCountdowns();
  }

  let holdCountdownTimer = null;
  function startHoldCountdowns() {
    clearInterval(holdCountdownTimer);
    const els = document.querySelectorAll('.tc-countdown[data-expires]');
    if (!els.length) return;

    function tick() {
      let anyLive = false;
      els.forEach(el => {
        const msLeft = new Date(el.dataset.expires).getTime() - Date.now();
        if (msLeft <= 0) {
          el.textContent = '⏰ Seat hold expired — refresh to update';
          // Announce the expiry transition exactly once, not on every
          // subsequent tick (the element's text stops changing after this,
          // so el._announcedExpired also guards against re-announcing).
          if (!el._announcedExpired) {
            el._announcedExpired = true;
            const announce = document.getElementById('holdExpiryAnnounce');
            if (announce) announce.textContent = 'A seat hold has expired. Refresh the page to see its current status.';
          }
          return;
        }
        anyLive = true;
        const totalSeconds = Math.floor(msLeft / 1000);
        const mm = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const ss = String(totalSeconds % 60).padStart(2, '0');
        el.textContent = `⏰ Seat held for ${mm}:${ss} — complete payment before it's released`;
      });
      if (!anyLive) clearInterval(holdCountdownTimer);
    }

    tick();
    holdCountdownTimer = setInterval(tick, 1000);
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadTickets();

    try {
      if (window.lottie) {
        window.lottie.loadAnimation({
          container: document.getElementById('lottie-myt'),
          renderer: 'svg', loop: true, autoplay: true,
          path: '/assets/lottie/ticket.json'
        });
      }
    } catch (e) {}

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      // ✅ Items 8/11 (Part 18): previously a bare, un-awaited-for-errors
      // `fetch` with no ceiling AND no try/catch — a network error here
      // threw unhandled and the rest of the handler (cache clear, redirect)
      // never ran, leaving Logout completely stuck. Now matches the
      // timeout + swallow-and-proceed pattern every other page's logout
      // button already uses (profile.html, Part 7; index/dashboard, Part 18).
      try {
        const doFetch = window.CVLoading ? window.CVLoading.fetchWithTimeout : (u, o) => fetch(u, o);
        await doFetch('/api/auth/logout', { method: 'POST', credentials: 'include' }, 10000);
      } catch (_) {}
      // Clear cached read-heavy data (including this page's own ticket
      // cache — see loadTickets() above) so a different user on the same
      // browser tab/session never inherits a stale-while-revalidate paint
      // of another account's tickets. Previously only index.html's nav
      // logout link did this; every page with its own logout button needs
      // it too now that my-tickets caches private per-user data.
      window.CVLoading?.clearCache();
      location.href = '/';
    });
  });
  </script>
  <script src="/assets/js/chatbot.js"></script>
</body>
</html>
