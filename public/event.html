<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Details - CampusVibe</title>
  <meta name="description" content="View event details, register instantly, and get a secure QR e-ticket on CampusVibe — the campus event management platform for fests, workshops, and hackathons." />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CampusVibe" />
  <meta property="og:title" content="Event Details - CampusVibe" />
  <meta property="og:description" content="View event details, register instantly, and get a secure QR e-ticket on CampusVibe — the campus event management platform for fests, workshops, and hackathons." />
  <meta property="og:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />
  <meta property="og:url" content="https://campusvibe-pu3g.onrender.com/event.html" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Event Details - CampusVibe" />
  <meta name="twitter:description" content="View event details, register instantly, and get a secure QR e-ticket on CampusVibe — the campus event management platform for fests, workshops, and hackathons." />
  <meta name="twitter:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />

  <!-- Item 4 (Part 16): Space Grotesk was previously loaded via an
       @import inside styles.css placed after other rules — invalid
       per the CSS spec (an @import must precede all other rules), so
       browsers silently ignored it and the custom display font never
       actually loaded. Moved to a real <link>, discoverable by the
       preload scanner in parallel with styles.css instead of only
       after it finishes downloading and parsing; preconnect warms the
       cross-origin connection early. display=swap (kept from the
       original URL) means body text never waits invisibly on it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script src="/assets/js/lottie.min.js" defer></script>
  <script src="/assets/i18n/i18n-data.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/loading.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="cv-header">
    <div class="container header-inner">
      <a href="/" class="brand" style="text-decoration:none;color:inherit">
        <img src="/assets/img/logo.svg" class="logo" alt="" />
        <div class="brand-text">
          <h1>CampusVibe</h1>
          <p class="tagline">Ideal Management, Ideal Moments</p>
        </div>
      </a>
      <div class="header-actions">
        <span data-i18n-mount></span>
        <a class="btn outline" href="/"><span data-i18n="nav_home">Home</span></a>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="container" style="padding:24px 0;">
    <div id="root">
      <!-- Initial skeleton: mirrors the loaded layout (banner, title, meta,
           ticket-tier grid, register button) so the page never renders as a
           blank container while /api/events/:uuid is in flight. Replaced by
           load() on success/error — see LOADING_STATES.md. -->
      <div class="card" style="padding:0;overflow:hidden;" aria-hidden="true" aria-busy="true">
        <span class="skel" style="display:block;height:150px;border-radius:0;"></span>
        <div style="padding:24px;">
          <span class="skel skel-text lg" style="width:60%;height:28px;"></span>
          <span class="skel skel-text" style="width:40%;"></span>
          <span class="skel skel-text" style="width:90%;"></span>
          <span class="skel skel-text" style="width:80%;"></span>
          <div class="flex" style="gap:10px;margin-top:16px;">
            <span class="skel skel-card" style="width:110px;height:70px;"></span>
            <span class="skel skel-card" style="width:110px;height:70px;"></span>
            <span class="skel skel-card" style="width:110px;height:70px;"></span>
          </div>
          <div class="flex" style="margin-top:20px;gap:8px;">
            <span class="skel skel-btn"></span>
            <span class="skel skel-btn"></span>
          </div>
        </div>
      </div>
    </div>
    <div id="lottie-event" style="height:160px; opacity:.5;"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const uuid = params.get('e');
    const forcedType = (params.get('type') || '').toLowerCase();
    if (!uuid) {
  document.getElementById('root').innerHTML =
    '<div class="alert warn" role="alert">Invalid event link</div>';
  throw new Error('Missing event UUID');
}
    // ✅ SEC fix (flagged in security audit Part 1, fixed here): escapes
    // organizer-controlled event fields before they're interpolated into
    // innerHTML, so a malicious title/description/location/category can't
    // inject markup/scripts into this page.
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }
    function formatEventDateRange(startIso, endIso) {
      const dateOpts = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
      const timeOpts = { hour: 'numeric', minute: '2-digit', hour12: true };
      const start = new Date(startIso);
      const startDateStr = start.toLocaleDateString('en-IN', dateOpts);
      const startTimeStr = start.toLocaleTimeString('en-IN', timeOpts);
      if (!endIso) return `${startDateStr}, ${startTimeStr} IST`;
      const end = new Date(endIso);
      const endDateStr = end.toLocaleDateString('en-IN', dateOpts);
      const endTimeStr = end.toLocaleTimeString('en-IN', timeOpts);
      if (startDateStr === endDateStr) return `${startDateStr}, ${startTimeStr} – ${endTimeStr} IST`;
      return `${startDateStr}, ${startTimeStr} – ${endDateStr}, ${endTimeStr} IST`;
    }

    // Shared WAI-ARIA "Menu Button" pattern for the Calendar and Share
    // fallback dropdowns below: aria-haspopup/aria-expanded on the
    // trigger, role="menu"/"menuitem" with a roving tabindex on the
    // options, Arrow/Home/End to move between them, and Escape (or
    // clicking outside) to close and return focus to the trigger. Both
    // menus previously worked with a mouse (click to toggle, click
    // outside to dismiss) but were keyboard/screen-reader inoperable:
    // nothing announced them as menus, arrow keys did nothing, and
    // Escape didn't close them.
    function setupMenuButton(btnEl, menuEl) {
      if (!btnEl || !menuEl) return null;
      const getItems = () => Array.from(menuEl.querySelectorAll('.share-option'));

      btnEl.setAttribute('aria-haspopup', 'true');
      btnEl.setAttribute('aria-expanded', 'false');
      btnEl.setAttribute('aria-controls', menuEl.id);

      function isOpen() { return menuEl.style.display === 'block'; }

      function openMenu(focusIndex) {
        menuEl.style.display = 'block';
        btnEl.setAttribute('aria-expanded', 'true');
        const items = getItems();
        items.forEach((it, i) => it.setAttribute('tabindex', i === focusIndex ? '0' : '-1'));
        if (focusIndex != null && items[focusIndex]) items[focusIndex].focus();
      }

      function closeMenu({ focusButton = false } = {}) {
        if (!isOpen()) return;
        menuEl.style.display = 'none';
        btnEl.setAttribute('aria-expanded', 'false');
        if (focusButton) btnEl.focus();
      }

      function focusItem(delta) {
        const items = getItems();
        if (!items.length) return;
        const currentIdx = Math.max(0, items.indexOf(document.activeElement));
        const next = items[(currentIdx + delta + items.length) % items.length];
        items.forEach(it => it.setAttribute('tabindex', '-1'));
        next.setAttribute('tabindex', '0');
        next.focus();
      }

      btnEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isOpen()) closeMenu();
        else openMenu(0);
      });

      btnEl.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); openMenu(0); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); openMenu(getItems().length - 1); }
        else if (e.key === 'Escape' && isOpen()) { e.preventDefault(); closeMenu(); }
      });

      menuEl.addEventListener('keydown', (e) => {
        const items = getItems();
        if (e.key === 'ArrowDown') { e.preventDefault(); focusItem(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); focusItem(-1); }
        else if (e.key === 'Home') { e.preventDefault(); items.forEach(it => it.setAttribute('tabindex', '-1')); items[0]?.setAttribute('tabindex', '0'); items[0]?.focus(); }
        else if (e.key === 'End') { e.preventDefault(); items.forEach(it => it.setAttribute('tabindex', '-1')); items[items.length - 1]?.setAttribute('tabindex', '0'); items[items.length - 1]?.focus(); }
        else if (e.key === 'Escape') { e.preventDefault(); closeMenu({ focusButton: true }); }
        else if (e.key === 'Tab') { closeMenu(); }
      });

      document.addEventListener('click', () => closeMenu());
      menuEl.addEventListener('click', (e) => e.stopPropagation());

      return { openMenu, closeMenu, isOpen };
    }

    function setupCalendarMenu(event) {
      const calBtn = document.getElementById('calendarBtn');
      const calMenu = document.getElementById('calendarMenu');
      const googleOpt = document.getElementById('googleCalOption');
      if (!calBtn || !calMenu) return;

      const menu = setupMenuButton(calBtn, calMenu);

      const icsOpt = calMenu.querySelector('a.share-option');
      // The .ics link performs a real navigation/download rather than an
      // in-page action, so it can't reuse the same closeMenu() call sites
      // as the button-based options below (the click isn't intercepted).
      // Still close the menu so it doesn't linger open after the download
      // starts, without preventing the link's default behavior.
      icsOpt?.addEventListener('click', () => { menu.closeMenu(); });

      googleOpt?.addEventListener('click', () => {
        menu.closeMenu({ focusButton: true });
        const toGCalDate = (isoStr) => {
          const d = new Date(isoStr);
          const pad = n => String(n).padStart(2, '0');
          return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
        };
        const endSource = event.end_time || new Date(new Date(event.start_time).getTime() + 2 * 60 * 60 * 1000).toISOString();
        const params = new URLSearchParams({
          action: 'TEMPLATE',
          text: event.title,
          dates: `${toGCalDate(event.start_time)}/${toGCalDate(endSource)}`,
          details: event.description || '',
          location: event.location || ''
        });
        window.open(`https://calendar.google.com/calendar/render?${params.toString()}`, '_blank', 'noopener,noreferrer');
      });
    }

    function setupShareMenu(event) {
      const shareBtn = document.getElementById('shareBtn');
      const shareMenu = document.getElementById('shareMenu');
      if (!shareBtn) return;

      const shareUrl = location.href;
      const shareText = `Join me at ${event.title}!`;

      // On devices/browsers that support it (most phones, some desktops),
      // prefer the native share sheet — it already lists WhatsApp,
      // Instagram, and whatever else the person has installed, without us
      // needing to guess which apps to list. In this branch #shareBtn is
      // a plain action button (no aria-haspopup/aria-expanded is added),
      // which is the correct semantics here: it doesn't disclose an
      // in-page menu, it invokes the OS share sheet directly.
      if (navigator.share) {
        shareBtn.addEventListener('click', async () => {
          try {
            await navigator.share({ title: event.title, text: shareText, url: shareUrl });
          } catch (e) {
            // User cancelled the share sheet — not an error, do nothing.
          }
        });
        return;
      }

      // Fallback: a small custom menu with the most common platforms.
      const menu = setupMenuButton(shareBtn, shareMenu);

      const links = {
        whatsapp: `https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`,
        facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`,
        twitter: `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`
      };

      shareMenu.querySelectorAll('.share-option').forEach(btn => {
        btn.addEventListener('click', async () => {
          const kind = btn.dataset.share;
          menu.closeMenu({ focusButton: true });

          if (kind === 'copy' || kind === 'instagram') {
            try {
              await navigator.clipboard.writeText(shareUrl);
            } catch (e) {
              // Fallback copy method for browsers without Clipboard API access
              const ta = document.createElement('textarea');
              ta.value = shareUrl;
              ta.style.position = 'fixed';
              ta.style.opacity = '0';
              document.body.appendChild(ta);
              ta.focus();
              ta.select();
              try { document.execCommand('copy'); } catch (_) {}
              document.body.removeChild(ta);
              // The temporary textarea above briefly took focus to run the
              // execCommand('copy') fallback; return it to the trigger
              // button (already the target of closeMenu's focusButton
              // above) instead of leaving focus on <body>.
              shareBtn.focus();
            }
            shareToast(kind === 'instagram'
              ? 'Link copied! Paste it into your Instagram bio or story.'
              : 'Link copied to clipboard!');
            return;
          }

          window.open(links[kind], '_blank', 'noopener,noreferrer');
        });
      });
    }

    function shareToast(text) {
      let el = document.getElementById('shareToast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'shareToast';
        el.className = 'share-toast';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        el.setAttribute('aria-atomic', 'true');
        document.body.appendChild(el);
      }
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function renderLoadError(isTimeout) {
      document.getElementById('root').innerHTML = `
        <div class="error-state" role="alert">
          <div class="icon" aria-hidden="true">${isTimeout ? '⏳' : '📡'}</div>
          <h3>${isTimeout ? 'Still loading…' : 'Unable to load this event'}</h3>
          <p class="muted">${isTimeout ? 'The connection seems slow. You can try again.' : "We couldn't reach CampusVibe. Check your connection and try again."}</p>
          <button type="button" class="btn outline" id="retryEventLoad">Retry</button>
        </div>
      `;
      const retryBtn = document.getElementById('retryEventLoad');
      retryBtn?.addEventListener('click', load);
      // ✅ Item 15 (Part 21): this replaces the entire #root content (the
      // whole page's reason for existing), so there's nothing else on the
      // page for focus to sensibly land on otherwise — move it to Retry.
      window.CVLoading?.focusErrorState(retryBtn);
    }

    async function load() {
      // Offline/recovery (Part 3, item 21): if this event was viewed
      // successfully before in this tab, keep that copy around so a dead
      // connection on a re-visit degrades to "showing saved details" rather
      // than a dead end. Never used for the register action itself (that
      // always needs a live request — see the register handler below).
      const cacheKey = `event:${uuid}`;
      let event;
      let usedCache = false;

      try {
        const res = window.CVLoading
          ? await window.CVLoading.fetchWithTimeout(`/api/events/${uuid}`, {}, 12000)
          : await fetch(`/api/events/${uuid}`);
        if (!res.ok) {
          if (res.status === 404) {
            document.getElementById('root').innerHTML = '<div class="alert warn" role="alert">Event not found</div>';
            return;
          }
          throw new Error('Failed to load event (' + res.status + ')');
        }
        ({ event } = await res.json());
        window.CVLoading?.cacheSet(cacheKey, event);
      } catch (err) {
        // Network failure / timeout / server error. Previously uncaught (for
        // the network-failure case), which left #root frozen on its last
        // state (blank on first load) forever. Now: fall back to a saved
        // copy if one exists, otherwise show a real ERROR state with Retry.
        const cached = window.CVLoading?.cacheGet(cacheKey);
        if (cached) {
          event = cached.data;
          usedCache = true;
        } else {
          renderLoadError(err && err.isTimeout);
          return;
        }
      }
      const priceSingle = Math.round(((event.price_single_cents ?? event.price_cents ?? 9000) / 100));
      const priceDuo = Math.round(((event.price_duo_cents ?? 18000) / 100));
      const priceTrio = Math.round(((event.price_trio_cents ?? 25000) / 100));
      const allowed = (event.allowed_tiers || 'single').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      let type = ['single','duo','trio'].includes(forcedType) ? forcedType : (allowed[0] || 'single');
      const isAllowed = allowed.includes(type);
      const isFull = typeof event.capacity === 'number' && event.remaining <= 0;

      const now = new Date();
      const eventEndOrStart = event.end_time ? new Date(event.end_time) : new Date(event.start_time);
      const isEnded = eventEndOrStart <= now;

      const timeRange = formatEventDateRange(event.start_time, event.end_time);
      const r = document.getElementById('root');

      const catKey = (event.category || 'technical').toLowerCase();
      const catIcon = { technical: '💻', cultural: '🎭', sports: '🏆', workshops: '🛠️' }[catKey] || '📌';

      r.innerHTML = `
        <div class="card" style="padding:0;overflow:hidden;">
          <div class="thumb thumb-${catKey}" style="height:150px;">
            <span class="cat-icon-bg" aria-hidden="true">${catIcon}</span>
            <span class="cat-chip cat-${catKey}"><span aria-hidden="true">${catIcon}</span> ${escapeHtml(event.category || 'Event')}</span>
          </div>
          <div style="padding:24px;">
          <div class="flex" style="align-items:center; gap:10px; margin-bottom:6px;">
            ${isEnded ? '<span class="tk-status status-rejected">Event Ended</span>' : ''}
          </div>
          <h2 style="margin-top:0;">${escapeHtml(event.title)}</h2>
          <div class="muted"><span aria-hidden="true">📅</span> ${escapeHtml(timeRange)} ${event.location ? '• <span aria-hidden="true">📍</span> ' + escapeHtml(event.location) : ''}</div>
          <p>${escapeHtml(event.description || '')}</p>
          <p><b>Capacity:</b> ${event.capacity ? `${event.capacity} (${event.remaining} tickets left)` : 'Not specified'}</p>

          <div class="flex-col">
            <label class="label" id="ticketTypeLabel">Choose Ticket Type</label>
            <div class="tier-price-grid" id="tierGrid" role="radiogroup" aria-labelledby="ticketTypeLabel"></div>
            <p class="muted" style="margin-top:2px;">Only tiers enabled by the organizer are selectable: ${allowed.join(', ') || 'single'}.</p>
          </div>

          ${event.discounts_enabled ? `
          <div class="row" style="margin-top:10px;">
            <div class="flex-col">
              <label class="label" for="discount">Discount code</label>
              <input id="discount" class="input" placeholder="Discount code (optional)" />
            </div>
            <div></div>
          </div>
          ` : ''}

          <div id="participantsWrap" class="card" style="margin-top:12px; background: rgba(255,255,255,0.03);">
            <h4 style="margin-top:0;">Participant Details</h4>
            <div id="participants"></div>
          </div>

          <div class="flex" style="margin-top:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
            <div id="priceDisplay" class="muted" style="font-size:1.1rem;font-weight:700;color:var(--fg);"></div>
            <div class="flex" style="gap:8px;">
              <button class="btn primary" id="reg">Register</button>
              <div class="share-wrap" style="position:relative;display:inline-block;">
                <button class="btn outline" id="calendarBtn" type="button"><span aria-hidden="true">📅</span> Add to Calendar</button>
                <div id="calendarMenu" class="share-menu" role="menu" aria-label="Calendar options" style="display:none;">
                  <a class="share-option" role="menuitem" tabindex="-1" href="/api/events/${event.uuid}/calendar.ics" style="text-decoration:none;"><span aria-hidden="true">⬇️</span> Download (.ics — Outlook, Apple Calendar)</a>
                  <button type="button" class="share-option" role="menuitem" tabindex="-1" id="googleCalOption"><span aria-hidden="true">📅</span> Add to Google Calendar</button>
                </div>
              </div>
              <div class="share-wrap" style="position:relative;display:inline-block;">
                <button class="btn outline" id="shareBtn" type="button"><span aria-hidden="true">🔗</span> Share</button>
                <div id="shareMenu" class="share-menu" role="menu" aria-label="Share options" style="display:none;">
                  <button type="button" class="share-option" role="menuitem" tabindex="-1" data-share="whatsapp"><span aria-hidden="true">💬</span> WhatsApp</button>
                  <button type="button" class="share-option" role="menuitem" tabindex="-1" data-share="facebook"><span aria-hidden="true">📘</span> Facebook</button>
                  <button type="button" class="share-option" role="menuitem" tabindex="-1" data-share="twitter"><span aria-hidden="true">🐦</span> X (Twitter)</button>
                  <button type="button" class="share-option" role="menuitem" tabindex="-1" data-share="instagram"><span aria-hidden="true">📸</span> Instagram</button>
                  <button type="button" class="share-option" role="menuitem" tabindex="-1" data-share="copy"><span aria-hidden="true">🔗</span> Copy Link</button>
                </div>
              </div>
            </div>
          </div>
          </div>
        </div>
      `;

      if (usedCache) {
        // Real content is already painted above — don't hide it behind a
        // loading/error state, just be honest that it's a saved copy.
        window.CVLoading?.showBanner("You're offline — showing saved event details.", 'cached');
      }

      setupShareMenu(event);
      setupCalendarMenu(event);

      function requiredCount(t) { return t === 'trio' ? 3 : (t === 'duo' ? 2 : 1); }
      function currentPrice(t) { return t === 'trio' ? priceTrio : (t === 'duo' ? priceDuo : priceSingle); }

      function renderParticipants(t) {
        const n = requiredCount(t);
        const cont = document.getElementById('participants');
        cont.innerHTML = '';
        for (let i = 1; i <= n; i++) {
          const div = document.createElement('div');
          div.className = 'row';
          div.innerHTML = `
            <div class="flex-col"><label class="label" for="pName${i}">Participant ${i} Name</label><input class="input" id="pName${i}" placeholder="Full name" /></div>
            <div class="flex-col"><label class="label" for="pRoll${i}">Participant ${i} Registration No.</label><input class="input" id="pRoll${i}" placeholder="Roll/Reg No." /></div>
          `;
          cont.appendChild(div);
        }
      }

      function updatePriceDisplay() {
        document.getElementById('priceDisplay').textContent = `Amount payable: ₹${currentPrice(type)}`;
      }

      function updateRegButtonState() {
        const isAllowedNow = allowed.includes(type);
        const reg = document.getElementById('reg');
        const disabled = !isAllowedNow || isFull || isEnded;
        const label = isEnded
          ? 'Event Ended'
          : (isFull ? 'Event Full' : (isAllowedNow ? 'Register' : 'Tier not allowed'));
        reg.disabled = disabled;
        reg.textContent = label;
      }

      const tierLabels = { single: 'Single', duo: 'Duo', trio: 'Trio' };
      const TIER_ORDER = ['single', 'duo', 'trio'];

      // Selecting a tier used to only be possible by clicking a plain <div>
      // with no keyboard handler at all — keyboard-only users could not
      // register for any event, since the ticket-type step blocked the
      // whole flow. Fixed by making #tierGrid a real ARIA radiogroup: each
      // card is role="radio" with aria-checked reflecting selection, uses a
      // roving tabindex (only the checked card is tabbable — Tab moves past
      // the whole group in one stop, matching native <input type="radio">
      // behavior), and Arrow keys / Enter / Space operate it, per the WAI-ARIA
      // Authoring Practices radio-group pattern.
      function selectTier(t, { focus = false } = {}) {
        if (!allowed.includes(t)) return;
        type = t;
        renderTierGrid();
        renderParticipants(type);
        updatePriceDisplay();
        updateRegButtonState();
        if (focus) document.querySelector(`.tier-price-card[data-tier="${type}"]`)?.focus();
      }

      function renderTierGrid() {
        const grid = document.getElementById('tierGrid');
        grid.innerHTML = ['single', 'duo', 'trio'].map(t => {
          const isAllowedTier = allowed.includes(t);
          const selected = t === type;
          return `
            <div class="tier-price-card ${selected ? 'selected' : ''} ${isAllowedTier ? '' : 'disabled'}"
                 data-tier="${t}" role="radio" aria-checked="${selected}"
                 ${isAllowedTier ? '' : 'aria-disabled="true"'}
                 tabindex="${isAllowedTier && selected ? '0' : '-1'}">
              <div class="tier-name">${tierLabels[t]}${isAllowedTier ? '' : ' <span class="sr-only">(not offered for this event)</span>'}</div>
              <div class="tier-amount">${isAllowedTier ? '₹' + currentPrice(t) : '—'}</div>
            </div>
          `;
        }).join('');
        grid.querySelectorAll('.tier-price-card').forEach(card => {
          card.addEventListener('click', () => selectTier(card.dataset.tier));
          card.addEventListener('keydown', (e) => {
            const allowedOrder = TIER_ORDER.filter(t => allowed.includes(t));
            if (!allowedOrder.length) return;
            const posInAllowed = allowedOrder.indexOf(type);
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
              e.preventDefault();
              selectTier(allowedOrder[(posInAllowed + 1) % allowedOrder.length], { focus: true });
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
              e.preventDefault();
              selectTier(allowedOrder[(posInAllowed - 1 + allowedOrder.length) % allowedOrder.length], { focus: true });
            } else if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              selectTier(card.dataset.tier);
            }
          });
        });
      }

      renderTierGrid();
      renderParticipants(type);
      updatePriceDisplay();
      updateRegButtonState();

      document.getElementById('reg').addEventListener('click', window.CVLoading
        ? window.CVLoading.guardSubmit(document.getElementById('reg'), handleRegisterClick)
        : handleRegisterClick);

      async function handleRegisterClick() {
        const isAllowedNow = allowed.includes(type);
        if (!isAllowedNow || isFull || isEnded) return;
        const discountEl = document.getElementById('discount');
        const code = discountEl ? discountEl.value.trim() : '';
        const need = requiredCount(type);
        const participants = [];
        for (let i = 1; i <= need; i++) {
          participants.push({ name: document.getElementById(`pName${i}`).value.trim(), roll_number: document.getElementById(`pRoll${i}`).value.trim() });
        }
        const body = { discount_code: code, ticket_type: type, participants };
        let res;
        try {
          // Registration is a state-changing, non-idempotent request — no
          // automatic retry (per spec §12). guardSubmit() above stops a
          // double-click from firing this twice; the button is disabled +
          // shows "Registering…" for the whole round trip via setButtonLoading.
          res = window.CVLoading
            ? await window.CVLoading.fetchWithTimeout(`/api/events/${event.uuid}/register`, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(body) }, 20000)
            : await fetch(`/api/events/${event.uuid}/register`, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(body) });
        } catch (err) {
          const msg = err && err.isTimeout
            ? 'This is taking longer than expected. Please check your connection — if the seat was reserved you will see it under My Tickets.'
            : "Couldn't reach CampusVibe. Please check your connection and try again.";
          document.querySelector('#root > .alert.warn')?.remove();
          document.getElementById('root').insertAdjacentHTML('afterbegin', `<div class="alert warn" role="alert" tabindex="-1">${msg}</div>`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          document.querySelector('#root > .alert.warn')?.focus();
          return;
        }
        if (res.status === 401) { location.href = '/login.html'; return; }
        const txt = await res.text();
        if (res.status >= 400) {
          let errMsg = txt;
          try { errMsg = JSON.parse(txt).error || txt; } catch (_) {}
          document.querySelector('#root > .alert.warn')?.remove();
          document.getElementById('root').insertAdjacentHTML('afterbegin', `<div class="alert warn" role="alert" tabindex="-1">${errMsg}</div>`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          // Move focus to the error itself, not just scroll to it — a screen-reader
          // user submitting the form is focused on the Register button, which is now
          // below the freshly-inserted error; without this the error is announced
          // once (via role="alert") but then silently left behind as unreachable
          // context once they resume tabbing.
          document.querySelector('#root > .alert.warn')?.focus();
          return;
        }
        const data = JSON.parse(txt);
        if (data.requires_payment) {
          sessionStorage.setItem('pending_ticket', data.ticket_uuid);
          location.href = `/payment.html?e=${event.uuid}&t=${data.ticket_uuid}`;
        } else if (data.ticket) {
          location.href = `/ticket.html?t=${data.ticket.uuid}`;
        }
      }
    }
    load();
    // Now that lottie.min.js loads with `defer` (item 4: progressive
    // loading), it's no longer guaranteed to have executed by the time
    // this runs synchronously during parsing. DOMContentLoaded fires only
    // after every deferred script has already run, so wrapping here
    // guarantees `window.lottie` is defined when this checks for it.
    document.addEventListener('DOMContentLoaded', () => {
      try {
        if (window.lottie) {
          window.lottie.loadAnimation({
            container: document.getElementById('lottie-event'),
            renderer: 'svg', loop: true, autoplay: true,
            path: '/assets/lottie/event.json'
          });
        }
      } catch (e) { /* ignore */ }
    });
  </script>
  <footer class="cv-footer">
    <div class="container" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <span>&copy; <span class="footer-year"></span> CampusVibe. Ideal Management, Ideal Moments.</span>
      <span><a href="/faq.html">FAQ / Help</a></span>
    </div>
  </footer>
  <script>document.querySelectorAll(".footer-year").forEach(function(el){el.textContent=new Date().getFullYear();});</script>
  <script src="/assets/js/chatbot.js"></script>
</body>
