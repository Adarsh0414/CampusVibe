<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Details - CampusVibe</title>
  <meta name="description" content="View event details, register instantly, and get a secure QR e-ticket on CampusVibe — the campus event management platform for fests, workshops, and hackathons." />
  <meta name="keywords" content="campus event details, college fest registration, hackathon signup, workshop tickets, CampusVibe" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://campusvibe-pu3g.onrender.com/event.html" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CampusVibe" />
  <meta property="og:title" content="Event Details - CampusVibe" />
  <meta property="og:description" content="View event details, register instantly, and get a secure QR e-ticket on CampusVibe — the campus event management platform for fests, workshops, and hackathons." />
  <meta property="og:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />
  <meta property="og:url" content="https://campusvibe-pu3g.onrender.com/event.html" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Event Details - CampusVibe" />
  <meta name="twitter:description" content="View event details, register instantly, and get a secure QR e-ticket on CampusVibe — the campus event management platform for fests, workshops, and hackathons." />
  <meta name="twitter:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />

  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script src="/assets/js/lottie.min.js"></script>
  <script src="/assets/i18n/i18n-data.js"></script>
  <script src="/assets/js/i18n.js"></script>
</head>
<body>
  <header class="cv-header">
    <div class="container header-inner">
      <a href="/" class="brand" style="text-decoration:none;color:inherit">
        <img src="/assets/img/logo.svg" class="logo" alt="CampusVibe" />
        <div class="brand-text">
          <h1>CampusVibe</h1>
          <p class="tagline">Ideal Management, Ideal Moments</p>
        </div>
      </a>
      <div class="header-actions">
        <span data-i18n-mount></span>
        <a class="btn outline" href="/"><span data-i18n="nav_home">Home</span></a>
      </div>
    </div>
  </header>

  <main class="container" style="padding:24px 0;">
    <div id="root"></div>
    <div id="lottie-event" style="height:160px; opacity:.5;"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const uuid = params.get('e');
    const forcedType = (params.get('type') || '').toLowerCase();
    if (!uuid) {
  document.getElementById('root').innerHTML =
    '<div class="alert warn">Invalid event link</div>';
  throw new Error('Missing event UUID');
}
    function formatEventDateRange(startIso, endIso) {
      const dateOpts = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
      const timeOpts = { hour: 'numeric', minute: '2-digit', hour12: true };
      const start = new Date(startIso);
      const startDateStr = start.toLocaleDateString('en-IN', dateOpts);
      const startTimeStr = start.toLocaleTimeString('en-IN', timeOpts);
      if (!endIso) return `${startDateStr}, ${startTimeStr} IST`;
      const end = new Date(endIso);
      const endDateStr = end.toLocaleDateString('en-IN', dateOpts);
      const endTimeStr = end.toLocaleTimeString('en-IN', timeOpts);
      if (startDateStr === endDateStr) return `${startDateStr}, ${startTimeStr} – ${endTimeStr} IST`;
      return `${startDateStr}, ${startTimeStr} – ${endDateStr}, ${endTimeStr} IST`;
    }

    function setupCalendarMenu(event) {
      const calBtn = document.getElementById('calendarBtn');
      const calMenu = document.getElementById('calendarMenu');
      const googleOpt = document.getElementById('googleCalOption');
      if (!calBtn || !calMenu) return;

      calBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        calMenu.style.display = calMenu.style.display === 'block' ? 'none' : 'block';
      });
      document.addEventListener('click', () => { calMenu.style.display = 'none'; });
      calMenu.addEventListener('click', (e) => e.stopPropagation());

      googleOpt?.addEventListener('click', () => {
        calMenu.style.display = 'none';
        const toGCalDate = (isoStr) => {
          const d = new Date(isoStr);
          const pad = n => String(n).padStart(2, '0');
          return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
        };
        const endSource = event.end_time || new Date(new Date(event.start_time).getTime() + 2 * 60 * 60 * 1000).toISOString();
        const params = new URLSearchParams({
          action: 'TEMPLATE',
          text: event.title,
          dates: `${toGCalDate(event.start_time)}/${toGCalDate(endSource)}`,
          details: event.description || '',
          location: event.location || ''
        });
        window.open(`https://calendar.google.com/calendar/render?${params.toString()}`, '_blank', 'noopener,noreferrer');
      });
    }

    function setupShareMenu(event) {
      const shareBtn = document.getElementById('shareBtn');
      const shareMenu = document.getElementById('shareMenu');
      if (!shareBtn) return;

      const shareUrl = location.href;
      const shareText = `Join me at ${event.title}!`;

      // On devices/browsers that support it (most phones, some desktops),
      // prefer the native share sheet — it already lists WhatsApp,
      // Instagram, and whatever else the person has installed, without us
      // needing to guess which apps to list.
      if (navigator.share) {
        shareBtn.addEventListener('click', async () => {
          try {
            await navigator.share({ title: event.title, text: shareText, url: shareUrl });
          } catch (e) {
            // User cancelled the share sheet — not an error, do nothing.
          }
        });
        return;
      }

      // Fallback: a small custom menu with the most common platforms.
      shareBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        shareMenu.style.display = shareMenu.style.display === 'block' ? 'none' : 'block';
      });
      document.addEventListener('click', () => { shareMenu.style.display = 'none'; });
      shareMenu.addEventListener('click', (e) => e.stopPropagation());

      const links = {
        whatsapp: `https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`,
        facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`,
        twitter: `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`
      };

      shareMenu.querySelectorAll('.share-option').forEach(btn => {
        btn.addEventListener('click', async () => {
          const kind = btn.dataset.share;
          shareMenu.style.display = 'none';

          if (kind === 'copy' || kind === 'instagram') {
            try {
              await navigator.clipboard.writeText(shareUrl);
            } catch (e) {
              // Fallback copy method for browsers without Clipboard API access
              const ta = document.createElement('textarea');
              ta.value = shareUrl;
              ta.style.position = 'fixed';
              ta.style.opacity = '0';
              document.body.appendChild(ta);
              ta.focus();
              ta.select();
              try { document.execCommand('copy'); } catch (_) {}
              document.body.removeChild(ta);
            }
            shareToast(kind === 'instagram'
              ? 'Link copied! Paste it into your Instagram bio or story.'
              : 'Link copied to clipboard!');
            return;
          }

          window.open(links[kind], '_blank', 'noopener,noreferrer');
        });
      });
    }

    function shareToast(text) {
      let el = document.getElementById('shareToast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'shareToast';
        el.className = 'share-toast';
        document.body.appendChild(el);
      }
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    async function load() {
      const res = await fetch(`/api/events/${uuid}`);
      if (!res.ok) { document.getElementById('root').innerHTML = '<div class="alert warn">Event not found</div>'; return; }
      const { event } = await res.json();
      const priceSingle = Math.round(((event.price_single_cents ?? event.price_cents ?? 9000) / 100));
      const priceDuo = Math.round(((event.price_duo_cents ?? 18000) / 100));
      const priceTrio = Math.round(((event.price_trio_cents ?? 25000) / 100));
      const allowed = (event.allowed_tiers || 'single').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      let type = ['single','duo','trio'].includes(forcedType) ? forcedType : (allowed[0] || 'single');
      const isAllowed = allowed.includes(type);
      const isFull = typeof event.capacity === 'number' && event.remaining <= 0;

      const now = new Date();
      const eventEndOrStart = event.end_time ? new Date(event.end_time) : new Date(event.start_time);
      const isEnded = eventEndOrStart <= now;

      const timeRange = formatEventDateRange(event.start_time, event.end_time);
      const r = document.getElementById('root');

      const catKey = (event.category || 'technical').toLowerCase();
      const catIcon = { technical: '💻', cultural: '🎭', sports: '🏆', workshops: '🛠️' }[catKey] || '📌';

      r.innerHTML = `
        <div class="card" style="padding:0;overflow:hidden;">
          <div class="thumb thumb-${catKey}" style="height:150px;">
            <span class="cat-icon-bg">${catIcon}</span>
            <span class="cat-chip cat-${catKey}">${catIcon} ${event.category || 'Event'}</span>
          </div>
          <div style="padding:24px;">
          <div class="flex" style="align-items:center; gap:10px; margin-bottom:6px;">
            ${isEnded ? '<span class="tk-status status-rejected">Event Ended</span>' : ''}
          </div>
          <h2 style="margin-top:0;">${event.title}</h2>
          <div class="muted">📅 ${timeRange} ${event.location ? '• 📍 ' + event.location : ''}</div>
          <p>${event.description || ''}</p>
          <p><b>Capacity:</b> ${event.capacity ? `${event.capacity} (${event.remaining} tickets left)` : 'Not specified'}</p>

          <div class="flex-col">
            <label class="label">Choose Ticket Type</label>
            <div class="tier-price-grid" id="tierGrid"></div>
            <p class="muted" style="margin-top:2px;">Only tiers enabled by the organizer are selectable: ${allowed.join(', ') || 'single'}.</p>
          </div>

          ${event.discounts_enabled ? `
          <div class="row" style="margin-top:10px;">
            <div class="flex-col">
              <label class="label">Discount code</label>
              <input id="discount" class="input" placeholder="Discount code (optional)" />
            </div>
            <div></div>
          </div>
          ` : ''}

          <div id="participantsWrap" class="card" style="margin-top:12px; background: rgba(255,255,255,0.03);">
            <h4 style="margin-top:0;">Participant Details</h4>
            <div id="participants"></div>
          </div>

          <div class="flex" style="margin-top:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
            <div id="priceDisplay" class="muted" style="font-size:1.1rem;font-weight:700;color:var(--fg);"></div>
            <div class="flex" style="gap:8px;">
              <button class="btn primary" id="reg">Register</button>
              <div class="share-wrap" style="position:relative;display:inline-block;">
                <button class="btn outline" id="calendarBtn" type="button">📅 Add to Calendar</button>
                <div id="calendarMenu" class="share-menu" style="display:none;">
                  <a class="share-option" href="/api/events/${event.uuid}/calendar.ics" style="text-decoration:none;">⬇️ Download (.ics — Outlook, Apple Calendar)</a>
                  <button type="button" class="share-option" id="googleCalOption">📅 Add to Google Calendar</button>
                </div>
              </div>
              <div class="share-wrap" style="position:relative;display:inline-block;">
                <button class="btn outline" id="shareBtn" type="button">🔗 Share</button>
                <div id="shareMenu" class="share-menu" style="display:none;">
                  <button type="button" class="share-option" data-share="whatsapp">💬 WhatsApp</button>
                  <button type="button" class="share-option" data-share="facebook">📘 Facebook</button>
                  <button type="button" class="share-option" data-share="twitter">🐦 X (Twitter)</button>
                  <button type="button" class="share-option" data-share="instagram">📸 Instagram</button>
                  <button type="button" class="share-option" data-share="copy">🔗 Copy Link</button>
                </div>
              </div>
            </div>
          </div>
          </div>
        </div>
      `;

      setupShareMenu(event);
      setupCalendarMenu(event);

      function requiredCount(t) { return t === 'trio' ? 3 : (t === 'duo' ? 2 : 1); }
      function currentPrice(t) { return t === 'trio' ? priceTrio : (t === 'duo' ? priceDuo : priceSingle); }

      function renderParticipants(t) {
        const n = requiredCount(t);
        const cont = document.getElementById('participants');
        cont.innerHTML = '';
        for (let i = 1; i <= n; i++) {
          const div = document.createElement('div');
          div.className = 'row';
          div.innerHTML = `
            <div class="flex-col"><label class="label">Participant ${i} Name</label><input class="input" id="pName${i}" placeholder="Full name" /></div>
            <div class="flex-col"><label class="label">Participant ${i} Registration No.</label><input class="input" id="pRoll${i}" placeholder="Roll/Reg No." /></div>
          `;
          cont.appendChild(div);
        }
      }

      function updatePriceDisplay() {
        document.getElementById('priceDisplay').textContent = `Amount payable: ₹${currentPrice(type)}`;
      }

      function updateRegButtonState() {
        const isAllowedNow = allowed.includes(type);
        const reg = document.getElementById('reg');
        const disabled = !isAllowedNow || isFull || isEnded;
        const label = isEnded
          ? 'Event Ended'
          : (isFull ? 'Event Full' : (isAllowedNow ? 'Register' : 'Tier not allowed'));
        reg.disabled = disabled;
        reg.textContent = label;
      }

      const tierLabels = { single: 'Single', duo: 'Duo', trio: 'Trio' };
      function renderTierGrid() {
        const grid = document.getElementById('tierGrid');
        grid.innerHTML = ['single', 'duo', 'trio'].map(t => {
          const isAllowedTier = allowed.includes(t);
          const selected = t === type;
          return `
            <div class="tier-price-card ${selected ? 'selected' : ''} ${isAllowedTier ? '' : 'disabled'}" data-tier="${t}">
              <div class="tier-name">${tierLabels[t]}</div>
              <div class="tier-amount">${isAllowedTier ? '₹' + currentPrice(t) : '—'}</div>
            </div>
          `;
        }).join('');
        grid.querySelectorAll('.tier-price-card').forEach(card => {
          card.addEventListener('click', () => {
            const t = card.dataset.tier;
            if (!allowed.includes(t)) return;
            type = t;
            renderTierGrid();
            renderParticipants(type);
            updatePriceDisplay();
            updateRegButtonState();
          });
        });
      }

      renderTierGrid();
      renderParticipants(type);
      updatePriceDisplay();
      updateRegButtonState();

      document.getElementById('reg').addEventListener('click', async () => {
        const isAllowedNow = allowed.includes(type);
        if (!isAllowedNow || isFull || isEnded) return;
        const discountEl = document.getElementById('discount');
        const code = discountEl ? discountEl.value.trim() : '';
        const need = requiredCount(type);
        const participants = [];
        for (let i = 1; i <= need; i++) {
          participants.push({ name: document.getElementById(`pName${i}`).value.trim(), roll_number: document.getElementById(`pRoll${i}`).value.trim() });
        }
        const body = { discount_code: code, ticket_type: type, participants };
        const res = await fetch(`/api/events/${event.uuid}/register`, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(body) });
        if (res.status === 401) { location.href = '/login.html'; return; }
        const txt = await res.text();
        if (res.status >= 400) {
          let errMsg = txt;
          try { errMsg = JSON.parse(txt).error || txt; } catch (_) {}
          document.querySelector('#root > .alert.warn')?.remove();
          document.getElementById('root').insertAdjacentHTML('afterbegin', `<div class="alert warn">${errMsg}</div>`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        const data = JSON.parse(txt);
        if (data.requires_payment) {
          sessionStorage.setItem('pending_ticket', data.ticket_uuid);
          location.href = `/payment.html?e=${event.uuid}&t=${data.ticket_uuid}`;
        } else if (data.ticket) {
          location.href = `/ticket.html?t=${data.ticket.uuid}`;
        }
      });
    }
    load();
    try {
      if (window.lottie) {
        window.lottie.loadAnimation({
          container: document.getElementById('lottie-event'),
          renderer: 'svg', loop: true, autoplay: true,
          path: '/assets/lottie/event.json'
        });
      }
    } catch (e) { /* ignore */ }
  </script>
  <footer class="cv-footer">
    <div class="container" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <span>&copy; <span class="footer-year"></span> CampusVibe. Ideal Management, Ideal Moments.</span>
      <span><a href="/faq.html">FAQ / Help</a></span>
    </div>
  </footer>
  <script>document.querySelectorAll(".footer-year").forEach(function(el){el.textContent=new Date().getFullYear();});</script>
  <script src="/assets/js/chatbot.js"></script>
</body>
</html>
