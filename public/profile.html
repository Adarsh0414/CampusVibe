<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Profile - CampusVibe</title>
  <meta name="description" content="Manage your CampusVibe profile and account settings." />
  <meta name="keywords" content="CampusVibe profile" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://campusvibe-pu3g.onrender.com/profile.html" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CampusVibe" />
  <meta property="og:title" content="Your Profile - CampusVibe" />
  <meta property="og:description" content="Manage your CampusVibe profile and account settings." />
  <meta property="og:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />
  <meta property="og:url" content="https://campusvibe-pu3g.onrender.com/profile.html" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Your Profile - CampusVibe" />
  <meta name="twitter:description" content="Manage your CampusVibe profile and account settings." />
  <meta name="twitter:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />

  <meta name="theme-color" content="#3b82f6">
  <!-- Item 4 (Part 16): Space Grotesk was previously loaded via an
       @import inside styles.css placed after other rules — invalid
       per the CSS spec (an @import must precede all other rules), so
       browsers silently ignored it and the custom display font never
       actually loaded. Moved to a real <link>, discoverable by the
       preload scanner in parallel with styles.css instead of only
       after it finishes downloading and parsing; preconnect warms the
       cross-origin connection early. display=swap (kept from the
       original URL) means body text never waits invisibly on it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script src="/assets/js/lottie.min.js" defer></script>
  <script src="/assets/i18n/i18n-data.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/loading.js"></script>
  <style>
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 4px solid #3b82f6; }
    .profile-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 16px; margin: 24px 0; }
    .stat-card { text-align: center; padding: 16px; background: rgba(255,255,255,0.05); border-radius: 12px; }
    .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 8px; }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @media (max-width: 768px) { .row { flex-direction: column; gap: 16px; } }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="cv-header">
    <div class="container header-inner">
      <a href="/" class="brand" style="text-decoration:none;color:inherit">
        <img src="/assets/img/logo.svg" class="logo" alt="" />
        <div class="brand-text">
          <h1>CampusVibe</h1>
          <p class="tagline">Ideal Management, Ideal Moments</p>
        </div>
      </a>
      <div class="header-actions">
        <span data-i18n-mount></span>
        <a href="#" id="logoutBtn" class="btn outline"><span data-i18n="nav_logout">Logout</span></a>
        <a class="btn outline" href="/"><span data-i18n="nav_home">Home</span></a>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="container" style="max-width:720px;padding:24px 0;">
  <!-- Loading skeleton -->
  <!-- ✅ Item 15 (Part 21): this skeleton had no aria-hidden (a screen
       reader landing on #main-content read out three meaningless
       "graphic"/blank nodes) and no announcement at all that a profile was
       loading — unlike every shared-.skel skeleton elsewhere in the app,
       which is aria-hidden with the loading state conveyed via aria-busy
       on a live region instead. Added both: aria-hidden hides the decorative
       bars themselves, and the visually-hidden status text gives screen
       readers the same "profile is loading" signal sighted users get from
       the animated bars. -->
  <div id="loading" style="text-align:center;padding:60px 20px;" aria-busy="true">
    <span class="sr-only" role="status">Loading your profile…</span>
    <div class="skeleton" aria-hidden="true" style="width:80px;height:80px;margin:0 auto 20px;border-radius:50%;"></div>
    <div class="skeleton" aria-hidden="true" style="width:300px;height:20px;margin:0 auto 16px;"></div>
    <div class="skeleton" aria-hidden="true" style="width:200px;height:20px;margin:0 auto;"></div>
  </div>
  
  <div id="profile-content" style="display:none;">
    <div class="flex" style="gap:20px;align-items:center;margin-bottom:24px;">
      <img id="avatar" class="profile-avatar" src="/assets/img/avatar-default.svg" alt="Profile" />
      <div>
        <h2 id="displayName">Loading...</h2>
        <p id="displayEmail" class="muted">Loading...</p>
      </div>
    </div>
    
    <div class="profile-stats" id="stats"></div>
    
    <div id="msg" role="status" aria-live="polite" aria-atomic="true"></div>
    <form id="profileForm" novalidate style="background:rgba(255,255,255,0.03);padding:24px;border-radius:12px;">
      <div class="row">
        <div class="flex-col">
          <label class="label" for="name">Full Name</label>
          <input id="name" class="input" required maxlength="50" />
        </div>
        <div class="flex-col">
          <label class="label" for="email">Email (verified)</label>
          <input id="email" class="input" disabled />
        </div>
      </div>
      <div class="row">
        <div class="flex-col">
          <label class="label" for="mobile">Mobile</label>
          <input id="mobile" class="input" maxlength="15" placeholder="+91 XXX123XXXX" />
        </div>
        <div class="flex-col">
          <label class="label" for="roll">Roll Number</label>
          <input id="roll" class="input" maxlength="20" placeholder="23XXX10XXX" />
        </div>
      </div>
      <div class="flex" style="gap:12px;justify-content:flex-end;margin-top:24px;">
        <button type="button" class="btn outline" id="cancel">Cancel</button>
        <button type="submit" class="btn primary" id="save">
          <span class="spinner" style="display:none;" aria-hidden="true"></span>
          <span class="btn-text">Save Changes</span>
        </button>
      </div>
    </form>
  </div>
</main>

  <script>
document.addEventListener('DOMContentLoaded', async () => {
  // ✅ Item 14 fix (Part 7): wired at top level (not inside initForm, which
  // only runs after a successful profile load) so logout still works even
  // if loadProfile() fails and the page is showing an error state — same
  // id/pattern as dashboard.html/index.html/my-tickets.html's header
  // logout button. This previously targeted
  // `document.querySelector('#save ~ button')`, which matched no element —
  // the markup had no logout button at all, so the handler never fired.
  document.getElementById('logoutBtn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      const doFetch = window.CVLoading ? window.CVLoading.fetchWithTimeout : (u, o) => fetch(u, o);
      await doFetch('/api/auth/logout', { method: 'POST', credentials: 'include' }, 10000);
    } catch (_) { /* even if logout couldn't be confirmed server-side, still send the user home */ }
    // See my-tickets.html's logout handler for why every page's own
    // logout button (not just index.html's nav one) needs this.
    window.CVLoading?.clearCache();
    location.href = '/';
  });

  await loadProfile();
  initLottie();
});

let currentUser = null;

async function loadProfile() {
  try {
    const res = window.CVLoading
      ? await window.CVLoading.fetchWithTimeout('/api/auth/me', { credentials: 'include' }, 12000)
      : await fetch('/api/auth/me', { credentials: 'include' });
    if (!res.ok) {
      if (res.status === 401) { location.href = '/login.html'; return; }
      // ✅ Error state (item 8): previously fell through silently here for
      // any non-401 failure (e.g. a 500), leaving the skeleton spinning
      // forever with no way out — the exact "stays blank/frozen forever"
      // bug this pass exists to catch. Now shows a real error state.
      showLoadError(false);
      return;
    }
    
    const { user } = await res.json();
    currentUser = user;
    renderProfile(user);
    initForm(user);
  } catch (error) {
    // ✅ Request timeout handling (item 11) + error state (item 8):
    // previously wrote into #msg, which lives inside #profile-content —
    // still `display:none` at this point since renderProfile() never ran.
    // The message was invisible and the skeleton never went away. Now
    // replaces the skeleton itself with a real, visible error state + Retry.
    showLoadError(error && error.isTimeout);
  }
}

function showLoadError(isTimeout) {
  document.getElementById('loading').innerHTML = `
    <div class="error-state" role="alert">
      <div class="icon" aria-hidden="true">${isTimeout ? '⏳' : '📡'}</div>
      <h3>${isTimeout ? 'Still loading…' : 'Unable to load your profile'}</h3>
      <p class="muted">${isTimeout ? 'The connection seems slow. You can try again.' : "We couldn't reach CampusVibe. Check your connection and try again."}</p>
      <button type="button" class="btn outline" id="retryProfileLoad">Retry</button>
    </div>`;
  const retryBtn = document.getElementById('retryProfileLoad');
  // ✅ Item 15 (Part 21): the whole page is this loading/error region until
  // the profile actually loads — nothing else is focusable yet, so move
  // focus to Retry.
  window.CVLoading?.focusErrorState(retryBtn);
  retryBtn?.addEventListener('click', () => {
    document.getElementById('loading').innerHTML = `
      <div class="skeleton" style="width:80px;height:80px;margin:0 auto 20px;border-radius:50%;"></div>
      <div class="skeleton" style="width:300px;height:20px;margin:0 auto 16px;"></div>
      <div class="skeleton" style="width:200px;height:20px;margin:0 auto;"></div>`;
    loadProfile();
  });
}

function renderProfile(user) {
  const avatarEl = document.getElementById('avatar');
  // Broken-image fallback (item 6): if avatar_url points to a missing/
  // deleted upload, fall back to the default avatar instead of showing a
  // broken-image icon in the profile header. Fixed dimensions are already
  // set via .profile-avatar CSS, so there's no layout-shift concern here.
  avatarEl.onerror = () => { avatarEl.onerror = null; avatarEl.src = '/assets/img/avatar-default.svg'; };
  avatarEl.src = user.avatar_url || '/assets/img/avatar-default.svg';
  document.getElementById('displayName').textContent = user.name || 'User';
  document.getElementById('displayEmail').textContent = user.email;
  
  // Stats cards
  const stats = document.getElementById('stats');
  stats.innerHTML = `
    <div class="stat-card">
      <div style="font-size:28px;font-weight:bold;color:#10b981;">${user.ticket_count || 0}</div>
      <div style="font-size:12px;color:#9ca3af;">Tickets</div>
    </div>
    <div class="stat-card">
      <div style="font-size:28px;font-weight:bold;color:#3b82f6;">${user.events_organized || 0}</div>
      <div style="font-size:12px;color:#9ca3af;">Events</div>
    </div>
  `;
  
  document.getElementById('loading').style.display = 'none';
  document.getElementById('profile-content').style.display = 'block';
}

function initForm(user) {
  document.getElementById('name').value = user.name || '';
  document.getElementById('email').value = user.email;
  document.getElementById('mobile').value = user.mobile || '';
  document.getElementById('roll').value = user.roll_number || '';
  
  const form = document.getElementById('profileForm');
  let redirectPending = false; // true once a successful save has a reload queued
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (redirectPending) return; // duplicate-submission guard (see item 14 note below)
    setLoading(true);
    
    try {
      const body = {
        name: document.getElementById('name').value.trim(),
        mobile: document.getElementById('mobile').value.trim(),
        roll_number: document.getElementById('roll').value.trim()
      };
      
      const res = window.CVLoading
        ? await window.CVLoading.fetchWithTimeout('/api/users/me', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(body)
          }, 15000)
        : await fetch('/api/users/me', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(body)
          });
      
      if (res.ok) {
        // ✅ Item 14 (Part 19 re-audit): `finally` used to run
        // setLoading(false) immediately, re-enabling "Save Changes" for
        // the full 1.5s before the reload actually fired — a second click
        // in that window could fire a real duplicate PUT. Keep the button
        // locked until the page actually reloads.
        redirectPending = true;
        showMessage('✅ Profile updated successfully!', 'success');
        setTimeout(() => location.reload(), 1500);
      } else {
        showMessage('❌ Failed to update profile', 'error');
      }
    } catch (error) {
      showMessage(error && error.isTimeout
        ? 'This is taking longer than expected. Please check your connection and try again.'
        : 'Network error. Please try again.', 'error');
    } finally {
      if (!redirectPending) setLoading(false);
    }
  });
  
  // Cancel button — discard any unsaved edits and restore the last-loaded values
  document.getElementById('cancel').addEventListener('click', () => {
    if (!currentUser) return;
    document.getElementById('name').value = currentUser.name || '';
    document.getElementById('mobile').value = currentUser.mobile || '';
    document.getElementById('roll').value = currentUser.roll_number || '';
    document.getElementById('msg').innerHTML = '';
  });
  
  // Logout is wired at top level (see DOMContentLoaded above), so it works
  // even when the profile fails to load and this function never runs.
}

function setLoading(loading) {
  const btn = document.getElementById('save');
  const spinner = btn.querySelector('.spinner');
  const text = btn.querySelector('.btn-text');
  btn.disabled = loading;
  // ✅ Item 15 (Part 21): this button had no aria-busy at all, despite the
  // spec listing it explicitly as still-queued — matches the pattern now
  // used on login/register/organizer-apply/payment's local button-spinner
  // buttons.
  if (loading) btn.setAttribute('aria-busy', 'true');
  else btn.removeAttribute('aria-busy');
  // ✅ Item 5 (Part 17): lock the button's rendered width before "Save
  // Changes" becomes "Saving...", so it doesn't resize — same pattern
  // CVLoading.setButtonLoading() uses elsewhere.
  if (loading) btn.style.minWidth = btn.getBoundingClientRect().width + 'px';
  else btn.style.minWidth = '';
  if (spinner) spinner.style.display = loading ? 'inline-block' : 'none';
  if (text) text.textContent = loading ? 'Saving...' : 'Save Changes';
}

function showMessage(text, type) {
  const msg = document.getElementById('msg');
  msg.innerHTML = `<div class="alert ${type}">${text}</div>`;
  setTimeout(() => msg.innerHTML = '', 4000);
}

function initLottie() {
  try {
    if (window.lottie) {
      window.lottie.loadAnimation({
        container: document.getElementById('lottie-profile'),
        renderer: 'svg', loop: true, autoplay: true,
        path: '/assets/lottie/profile.json'
      });
    }
  } catch (e) { console.warn('Lottie failed'); }
}
</script>
  <footer class="cv-footer">
    <div class="container" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <span>&copy; <span class="footer-year"></span> CampusVibe. Ideal Management, Ideal Moments.</span>
      <span><a href="/faq.html">FAQ / Help</a></span>
    </div>
  </footer>
  <script>document.querySelectorAll(".footer-year").forEach(function(el){el.textContent=new Date().getFullYear();});</script>
  <script src="/assets/js/chatbot.js"></script>
</body>
</html>
