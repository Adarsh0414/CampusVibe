<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="canonical" href="https://campusvibe-pu3g.onrender.com/login.html" />

  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5" />

  <!-- Open Graph -->

  <meta property="og:title" content="Login - CampusVibe" />
  <meta property="og:description" content="Log in to your CampusVibe account to browse events, manage your tickets, and check in to campus events." />

  <meta property="og:url" content="https://campusvibe-pu3g.onrender.com/login.html" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Login - CampusVibe" />
  <meta name="twitter:description" content="Log in to your CampusVibe account to browse events, manage your tickets, and check in to campus events." />
  <meta name="twitter:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />

  <!-- Item 4 (Part 16): Space Grotesk was previously loaded via an
       @import inside styles.css placed after other rules — invalid
       per the CSS spec (an @import must precede all other rules), so
       browsers silently ignored it and the custom display font never
       actually loaded. Moved to a real <link>, discoverable by the
       preload scanner in parallel with styles.css instead of only
       after it finishes downloading and parsing; preconnect warms the
       cross-origin connection early. display=swap (kept from the
       original URL) means body text never waits invisibly on it. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <meta name="theme-color" content="#6c88ff">
  <script src="/assets/js/lottie.min.js" defer></script>
  <script src="/assets/i18n/i18n-data.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/loading.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="cv-header">
    <div class="container header-inner">
      <a href="/" class="brand" style="text-decoration:none;color:inherit">
        <img src="/assets/img/logo.svg" class="logo" alt="" />
        <div class="brand-text">
          <h1>CampusVibe</h1>
          <p class="tagline">Ideal Management, Ideal Moments</p>
        </div>
      </a>
      <div class="header-actions">
        <span data-i18n-mount></span>
        <a href="/" class="btn" style="text-decoration:none;color:inherit"><span data-i18n="nav_home">Home</span></a>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1" class="container" style="padding:0;">
    <style>
      .auth-wrap { position: relative; min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 40px 16px; }
      .anim-bg { position: fixed; inset: 0; z-index: -1; background:
        radial-gradient(1000px 500px at 10% 10%, rgba(108,140,255,0.18), transparent 60%),
        radial-gradient(900px 450px at 90% 0%, rgba(0,209,178,0.14), transparent 60%),
        linear-gradient(180deg, #0b1021 0%, #0e1738 100%);
        animation: bgShift 18s ease-in-out infinite alternate; }
      @keyframes bgShift { from { filter: hue-rotate(0deg) saturate(1); } to { filter: hue-rotate(20deg) saturate(1.1); } }
      .orb { position: absolute; width: 320px; height: 320px; border-radius: 50%; filter: blur(18px); mix-blend-mode: screen; opacity: .5; }
      .o1 { top: 6%; left: 4%; background: radial-gradient(circle at 30% 30%, rgba(108,140,255,.55), transparent 60%); animation: floatY 10s ease-in-out infinite; }
      .o2 { bottom: 8%; left: 15%; background: radial-gradient(circle at 40% 40%, rgba(0,209,178,.45), transparent 60%); animation: floatX 13s ease-in-out infinite; }
      .o3 { top: 15%; right: 12%; background: radial-gradient(circle at 50% 50%, rgba(140,82,255,.45), transparent 60%); animation: floatY 11s ease-in-out infinite .5s; }
      .o4 { bottom: 12%; right: 6%; background: radial-gradient(circle at 60% 60%, rgba(255,111,145,.40), transparent 60%); animation: floatX 12s ease-in-out infinite .2s; }
      @keyframes floatY { 0%, 100% { transform: translateY(-8px); } 50% { transform: translateY(8px); } }
      @keyframes floatX { 0%, 100% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }
      .auth-card { width: 100%; max-width: 540px; border-radius: 16px; border: 1px solid var(--border); background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(12px); box-shadow: var(--shadow); padding: 22px; }
      .auth-title { margin: 0 0 6px; font-size: 1.6rem; }
      .auth-sub { margin: 0 0 16px; color: var(--muted); }
      .btn.primary { box-shadow: 0 10px 25px rgba(108,140,255,.25); }
      .btn.primary:hover { transform: translateY(-1px); }
      .input.invalid { border-color: #ef4444 !important; box-shadow: 0 0 0 3px rgba(239,68,68,.2); }
      .input.valid { border-color: #10b981 !important; box-shadow: 0 0 0 3px rgba(16,185,129,.2); }
      .alert { padding: 12px; margin: 12px 0; border-radius: 8px; font-weight: 500;}
      .alert.error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
      .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid transparent; border-top: 2px solid currentColor; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; }
      .btn-google { display: flex !important; align-items: center; justify-content: center; gap: 8px; width: 100%; }
      .auth-divider { margin: 20px 0; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);text-align: center;position: relative;}
      .auth-divider::before { content: 'or'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: rgba(17,24,39,0.8); padding: 0 16px; color: #9ca3af; font-size: 14px;}
      .form { display: flex; flex-direction: column; gap: 20px;  /* Perfect 20px between ALL form elements */}
      .flex-col { display: flex; flex-direction: column; gap: 6px;   /* Perfect space between label + input */}
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 480px) { .auth-card { margin: 0 8px; padding: 20px; } }
    </style>

    <div class="auth-wrap">
      <div class="anim-bg">
        <span class="orb o1"></span>
        <span class="orb o2"></span>
        <span class="orb o3"></span>
        <span class="orb o4"></span>
        <div id="lottie-login" style="position:absolute; inset:0; opacity:.35; pointer-events:none;"></div>
      </div>

      <div class="auth-card">
        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-sub">Sign in to continue to CampusVibe</p>
        <div id="msg" role="status" aria-live="polite" aria-atomic="true"></div>
        <form id="loginForm" novalidate autocomplete="off">
          <div class="flex-col">
            <label class="label" for="email">Email Address</label>
            <input class="input" id="email" name="cv_login_email" type="email" autocomplete="off" placeholder="e.g. yourname@college.edu" required />
          </div>
          <div class="flex-col" style="margin-bottom: 20px;">
            <label class="label" for="password">Password</label>
            <input class="input" id="password" name="cv_login_password" type="password" autocomplete="off" placeholder="Enter your password" required minlength="6" />
          </div>

          <button class="btn primary" type="submit" id="loginBtn">
            <span class="spinner" style="display:none;" aria-hidden="true"></span>
            <span class="btn-text">Sign In</span>
          </button>
        </form>
        <div style="margin: 20px 0; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
          <a class="btn outline" href="#" id="googleBtn"> 🌐 Login with Google</a>
          <p class="muted" style="text-align: center; margin-top: 24px;">New user? <a href="/register.html">Register</a></p>
        </div>
      </div>
    </div>
</main>

  <script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const emailEl = document.getElementById('email');
  const passEl = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const googleBtn = document.getElementById('googleBtn');

  // Surface a clear message if we bounced back here from a failed/unconfigured Google login.
  (function checkOAuthError() {
    const err = new URLSearchParams(location.search).get('error');
    if (err === 'google_not_configured') {
      showMessage('Google Sign-In isn\'t set up on this server yet. Please sign in with email and password instead.', 'error');
    } else if (err === 'google_auth_failed') {
      showMessage('Google Sign-In didn\'t complete. Please try again, or use email and password.', 'error');
    }
  })();

  // ✅ Security fix: on a shared/public computer, the browser can restore a
  // previous person's typed email/password via autofill or the back/forward
  // cache. Force both fields empty every time this page is shown, so only
  // placeholder text is ever visible until someone types their own details.
  function clearCredentialFields() {
    emailEl.value = '';
    passEl.value = '';
    emailEl.classList.remove('valid', 'invalid');
    passEl.classList.remove('valid', 'invalid');
  }
  clearCredentialFields();
  window.addEventListener('pageshow', clearCredentialFields);

  // Lottie animation. Now that lottie.min.js loads with `defer` (item 4:
  // progressive loading — a 305KB decorative-animation library shouldn't
  // block HTML parsing/paint), it's no longer guaranteed to have executed
  // by the time this script runs synchronously during parsing. Wrapping in
  // DOMContentLoaded guarantees it runs after every deferred script has
  // already executed, so `window.lottie` is reliably defined here.
  document.addEventListener('DOMContentLoaded', () => {
    try {
      if (window.lottie) {
        window.lottie.loadAnimation({
          container: document.getElementById('lottie-login'),
          renderer: 'svg', loop: true, autoplay: true,
          path: '/assets/lottie/login.json'
        });
      }
    } catch (e) { console.warn('Lottie failed'); }
  });

  // Form validation + submission
  let redirectPending = false; // true once a successful login has navigation queued
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (redirectPending) return; // duplicate-submission guard (see item 14 note below)
    if (!validateForm()) return;
    
    setLoading(true);
    try {
      const email = emailEl.value.trim();
      const password = passEl.value;
      
      const res = window.CVLoading
        ? await window.CVLoading.fetchWithTimeout('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify({ email, password })
          }, 15000)
        : await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify({ email, password })
          });
      
      if (!res.ok) {
        const { message = 'Invalid credentials' } = await res.json().catch(() => ({}));
        showMessage(message, 'error');
        return;
      }
      
      // Success - redirect based on role
      // ✅ Item 14 (Part 19 re-audit): navigation here is immediate (no
      // setTimeout), so the re-enable window `finally` creates is only as
      // long as the current task's remaining synchronous code + one tick —
      // far smaller than register/profile/payment's old 1.5-2s windows —
      // but the same guard is added here too for consistency and defense
      // in depth, in case a slow `location.href` handoff ever leaves a
      // window open (e.g. a browser back-forward-cache edge case).
      redirectPending = true;
      const { user } = await res.json();
      location.href = (user.role === 'committee' || user.role === 'admin') ? '/dashboard.html' : '/';
      
    } catch (error) {
      // ✅ Request timeout handling (item 11): login previously had no
      // ceiling at all — a hung request left the button stuck on
      // "Signing in..." forever with no way out. fetchWithTimeout (15s)
      // now guarantees this catch block is reached either way, and the
      // message is specific about which failure occurred.
      showMessage(error && error.isTimeout
        ? 'This is taking longer than expected. Please check your connection and try again.'
        : 'Network error. Check connection.', 'error');
    } finally {
      if (!redirectPending) setLoading(false);
    }
  });

  // Real-time validation
  [emailEl, passEl].forEach(el => {
    el.addEventListener('blur', () => validateField(el));
    el.addEventListener('input', () => clearFieldError(el));
  });

  // Google OAuth
  googleBtn?.addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = '/api/auth/google';
  });

  // Utility functions
  function validateForm() {
    let valid = true;
    [emailEl, passEl].forEach(el => valid = validateField(el) && valid);
    return valid;
  }

  function validateField(el) {
    el.classList.remove('invalid', 'valid');
    
    if (!el.value.trim()) {
      el.classList.add('invalid');
      return false;
    }
    
    if (el.id === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value)) {
      el.classList.add('invalid');
      return false;
    }
    
    if (el.id === 'password' && el.value.length < 6) {
      el.classList.add('invalid');
      return false;
    }
    
    el.classList.add('valid');
    return true;
  }

  function clearFieldError(el) {
    el.classList.remove('invalid');
  }

  function setLoading(loading) {
    loginBtn.disabled = loading;
    // ✅ Item 15 (Part 21): was missing aria-busy — the tracker had
    // previously (incorrectly) claimed this was already fixed; it wasn't.
    if (loading) loginBtn.setAttribute('aria-busy', 'true');
    else loginBtn.removeAttribute('aria-busy');
    const spinner = loginBtn.querySelector('.spinner');
    const text = loginBtn.querySelector('.btn-text');
    // ✅ Item 5 (Part 17): the button isn't full-width here, so swapping
    // "Sign In" for the longer "Signing in..." (+ spinner) would otherwise
    // visibly widen the button — lock the rendered width first, same
    // pattern CVLoading.setButtonLoading() uses elsewhere in the app.
    if (loading) loginBtn.style.minWidth = loginBtn.getBoundingClientRect().width + 'px';
    else loginBtn.style.minWidth = '';
    if (spinner) spinner.style.display = loading ? 'inline-block' : 'none';
    if (text) text.textContent = loading ? 'Signing in...' : 'Sign In';
  }

  function showMessage(text, type = 'success') {
    msg.innerHTML = `<div class="alert ${type}">${text}</div>`;
    setTimeout(() => msg.innerHTML = '', 5000);
  }
</script>
  <footer class="cv-footer">
    <div class="container" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <span>&copy; <span class="footer-year"></span> CampusVibe. Ideal Management, Ideal Moments.</span>
      <span><a href="/faq.html">FAQ / Help</a></span>
    </div>
  </footer>
  <script>document.querySelectorAll(".footer-year").forEach(function(el){el.textContent=new Date().getFullYear();});</script>
  <script src="/assets/js/chatbot.js"></script>
</body>
</html>
