<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your E-Ticket - CampusVibe</title>
  <meta name="description" content="Your secure QR e-ticket for a CampusVibe event." />
  <meta name="keywords" content="CampusVibe e-ticket, QR ticket" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://campusvibe-pu3g.onrender.com/ticket.html" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CampusVibe" />
  <meta property="og:title" content="Your E-Ticket - CampusVibe" />
  <meta property="og:description" content="Your secure QR e-ticket for a CampusVibe event." />
  <meta property="og:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />
  <meta property="og:url" content="https://campusvibe-pu3g.onrender.com/ticket.html" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Your E-Ticket - CampusVibe" />
  <meta name="twitter:description" content="Your secure QR e-ticket for a CampusVibe event." />
  <meta name="twitter:image" content="https://campusvibe-pu3g.onrender.com/assets/img/icon-512.png" />

  <meta name="theme-color" content="#5178ff" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script src="/assets/js/lottie.min.js"></script>
  <script src="/assets/i18n/i18n-data.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <style>
    body { background: var(--bg); }

    /* Boarding-pass ticket wrapper */
    .ticket-wrap {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 16px 60px;
    }

    /* Gradient by category */
    .hdr-technical { background: linear-gradient(135deg, #1a2a80, #3558ee 60%, #5178ff); }
    .hdr-cultural  { background: linear-gradient(135deg, #6b1030, #c43055 60%, #f04d6b); }
    .hdr-sports    { background: linear-gradient(135deg, #7a4a00, #d97706 60%, #fbbf24); }
    .hdr-workshops { background: linear-gradient(135deg, #004d38, #0bae80 60%, #10d9a0); }
    .hdr-default   { background: linear-gradient(135deg, #2d1b69, #5b21b6 60%, #a78bfa); }

    /* Perforated divider */
    .perf-divider {
      width: 100%;
      height: 1px;
      margin: 0;
      background: repeating-linear-gradient(
        to right,
        transparent 0, transparent 8px,
        var(--border-2) 8px, var(--border-2) 16px
      );
      position: relative;
    }
    .perf-divider::before,
    .perf-divider::after {
      content: '';
      position: absolute;
      top: -14px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .perf-divider::before { left: -14px; }
    .perf-divider::after  { right: -14px; }

    /* QR glow states */
    .qr-paid    { box-shadow: 0 0 0 4px rgba(16,217,160,0.25), 0 8px 32px rgba(16,217,160,0.20); }
    .qr-pending { box-shadow: 0 0 0 4px rgba(251,191,36,0.25), 0 8px 32px rgba(251,191,36,0.10); }
    .qr-holder {
      width: 180px; height: 180px;
      border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      gap: 10px;
      font-size: 3rem;
    }

    /* Ticket number chip */
    .tkt-num {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-2);
      border-radius: 999px;
      padding: 3px 12px;
      font-family: 'Space Grotesk', monospace;
      font-size: 0.8rem;
      color: var(--fg-2);
      letter-spacing: 1px;
    }

    /* Meta rows */
    .meta-row { display:flex; flex-direction:column; gap:3px; margin-bottom:16px; }
    .meta-key { font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted-2); font-weight:600; }
    .meta-val { font-size:0.95rem; color:var(--fg); font-weight:600; }

    /* Print */
    @media print {
      body * { visibility: hidden; }
      .ticket, .ticket * { visibility: visible; }
      .ticket { box-shadow: none; position: absolute; left:0; top:0; width:100%; border:none; }
      .no-print { display: none !important; }
    }

    /* Participants list */
    .participant { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
    .participant:last-child { border-bottom:none; }
    .p-num { width:22px; height:22px; border-radius:50%; background:rgba(81,120,255,0.20); color:var(--primary); font-size:0.75rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  </style>
</head>
<body>
  <header class="cv-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="/assets/img/logo.svg" class="logo" alt="CampusVibe" />
        <div class="brand-text">
          <h1>CampusVibe</h1>
          <p class="tagline">Ideal Management, Ideal Moments</p>
        </div>
      </a>
      <nav class="nav">
        <a href="/my-tickets.html" class="nav-link"><span data-i18n="nav_my_tickets">My Tickets</span></a>
        <span data-i18n-mount class="no-print"></span>
        <a href="/" class="btn outline sm no-print"><span data-i18n="nav_home">Home</span></a>
        <button id="printTicketBtn" class="btn primary sm no-print">🖨️ Print</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Loading skeleton -->
    <div id="loading" class="ticket-wrap">
      <div class="skeleton" style="height:160px; border-radius:20px 20px 0 0;"></div>
      <div class="skeleton" style="height:220px; margin-top:2px; border-radius:0 0 20px 20px;"></div>
    </div>

    <!-- Ticket content -->
    <div id="ticket-content" class="ticket-wrap" style="display:none;">
      <div id="root"></div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    const printBtn = document.getElementById('printTicketBtn');
    if (printBtn) {
      printBtn.addEventListener('click', () => {
        try {
          window.print();
        } catch (e) {
          alert("Couldn't open the print dialog automatically. Please use your browser's Print option (Ctrl/Cmd + P) instead.");
        }
      });
    }

    const params = new URLSearchParams(location.search);
    const t = params.get('ticket') || params.get('t');

    if (!t) {
      renderError('Invalid ticket link. Please check your URL.');
      return;
    }

    try {
      const res = await fetch(`/api/tickets/${t}`, { credentials: 'include' });
      if (res.status === 401) { location.href = '/login.html'; return; }
      if (!res.ok) { renderError('Ticket not found or access denied.'); return; }
      const { ticket } = await res.json();
      renderTicket(ticket);
    } catch (e) {
      renderError('Failed to load ticket. Please try again.');
    }
  });

  function getCatHeaderClass(category) {
    const map = { technical:'hdr-technical', cultural:'hdr-cultural', sports:'hdr-sports', workshops:'hdr-workshops' };
    return map[(category||'').toLowerCase()] || 'hdr-default';
  }

  function renderTicket(ticket) {
    let participants = [];
    try { participants = JSON.parse(ticket.participants_json || '[]'); } catch {}

    const isPaid     = ticket.payment_status === 'paid' || ticket.payment_status === 'verified';
    const isPending  = ticket.payment_status === 'pending';
    const isRejected = ticket.payment_status === 'rejected';
    const isCheckedIn = !!ticket.checked_in;

    const startDate = ticket.start_time
      ? new Date(ticket.start_time).toLocaleString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' })
      : '—';
    const endDate = ticket.end_time
      ? new Date(ticket.end_time).toLocaleString('en-IN', { hour:'2-digit', minute:'2-digit', month:'short', day:'numeric' })
      : null;

    const groupLabel = { single:'Single', duo:'Duo (2 people)', trio:'Trio (3 people)' }[ticket.group_type] || ticket.group_type || 'Single';

    let qrSection;
    if (isPaid && ticket.qr_code) {
      qrSection = `
        <div class="ticket-qr">
          <img src="${ticket.qr_code}" alt="QR Code" class="qr-paid" style="border-radius:12px; width:180px; height:180px;" />
          <div style="margin-top:10px; font-size:0.78rem; color:var(--success); font-weight:600; text-align:center;">
            ✅ Scan at entry
          </div>
        </div>
      `;
    } else if (isPending) {
      qrSection = `
        <div class="ticket-qr">
          <div class="qr-holder qr-pending" style="background:rgba(251,191,36,0.08); border:1px solid rgba(251,191,36,0.3); border-radius:12px; width:180px; height:180px;">
            <span>⏳</span>
            <span style="font-size:0.78rem; color:var(--warning); text-align:center; font-weight:600; padding:0 12px;">Verification in progress</span>
          </div>
          <div style="margin-top:10px; font-size:0.75rem; color:var(--muted); text-align:center;">
            QR appears after approval
          </div>
        </div>
      `;
    } else if (isRejected) {
      qrSection = `
        <div class="ticket-qr">
          <div class="qr-holder" style="background:rgba(240,77,107,0.08); border:1px solid rgba(240,77,107,0.3); border-radius:12px; width:180px; height:180px;">
            <span>❌</span>
            <span style="font-size:0.78rem; color:var(--danger); text-align:center; font-weight:600; padding:0 12px;">Payment Rejected</span>
          </div>
          <a href="/payment.html?e=${ticket.event_uuid || ''}&t=${ticket.uuid}" class="btn danger sm" style="margin-top:10px; width:180px; justify-content:center;">Re-submit Proof</a>
        </div>
      `;
    } else {
      qrSection = `
        <div class="ticket-qr">
          <div class="qr-holder" style="background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:12px; width:180px; height:180px;">
            <span>💳</span>
            <span style="font-size:0.78rem; color:var(--muted); text-align:center; padding:0 12px;">Payment required</span>
          </div>
        </div>
      `;
    }

    const html = `
      <div class="ticket">
        <!-- Header -->
        <div class="ticket-header ${getCatHeaderClass(ticket.category)}">
          <div class="ticket-org">🎓 CampusVibe E-Ticket</div>
          <h2 style="margin: 8px 0 6px; font-size:1.6rem;">${esc(ticket.event_title)}</h2>
          <div style="font-size:0.85rem; opacity:0.85;">${startDate} IST${endDate ? ' – ' + endDate : ''}</div>
          ${isCheckedIn ? '<div style="margin-top:8px; background:rgba(16,217,160,0.25); border:1px solid rgba(16,217,160,0.5); border-radius:999px; padding:4px 14px; display:inline-block; font-size:0.78rem; font-weight:700; color:#a0ffe0; letter-spacing:0.5px;">✅ CHECKED IN</div>' : ''}
        </div>

        <!-- Perforated divider -->
        <div class="perf-divider"></div>

        <!-- Body -->
        <div class="ticket-body" style="padding-top:32px;">
          <div class="ticket-meta">
            <div class="meta-row">
              <span class="meta-key">Ticket ID</span>
              <span class="tkt-num">#${String(ticket.ticket_number || 0).padStart(6,'0')}</span>
            </div>

            ${ticket.location ? `
            <div class="meta-row">
              <span class="meta-key">Location</span>
              <span class="meta-val">📍 ${esc(ticket.location)}</span>
            </div>` : ''}

            <div class="meta-row">
              <span class="meta-key">Ticket Type</span>
              <span class="meta-val">${groupLabel}</span>
            </div>

            <div class="meta-row">
              <span class="meta-key">Payment Status</span>
              <span class="meta-val">
                ${isPaid     ? '<span class="badge success">✅ Confirmed</span>'             : ''}
                ${isPending  ? '<span class="badge warning">⏳ Pending Verification</span>'  : ''}
                ${isRejected ? '<span class="badge danger">❌ Payment Rejected</span>'        : ''}
                ${(!isPaid && !isPending && !isRejected) ? '<span class="badge muted">Unpaid</span>' : ''}
              </span>
            </div>

            ${participants.length ? `
            <div class="meta-row">
              <span class="meta-key">Participants (${participants.length})</span>
              <div>
                ${participants.map((p, i) => `
                  <div class="participant">
                    <span class="p-num">${i+1}</span>
                    <span>${esc(p.name || 'N/A')}${p.roll_number ? ` <span style="color:var(--muted);font-size:0.8rem;">(${esc(p.roll_number)})</span>` : ''}</span>
                  </div>
                `).join('')}
              </div>
            </div>` : ''}
          </div>

          ${qrSection}
        </div>

        <!-- Perforated divider -->
        <div class="perf-divider" style="margin-top:0;"></div>

        <!-- Footer -->
        <div class="ticket-footer">
          <span>🎓 CampusVibe · Ideal Management, Ideal Moments</span>
          <span>Generated ${new Date().toLocaleDateString('en-IN')}</span>
        </div>
      </div>

      ${isPending ? `
      <div class="alert warning" style="margin-top:20px;">
        <strong>⏳ Verification Pending</strong> — Your payment is being reviewed. Your QR code will appear here once an organizer approves it. Check back soon!
      </div>` : ''}
    `;

    document.getElementById('root').innerHTML = html;
    document.getElementById('loading').style.display    = 'none';
    document.getElementById('ticket-content').style.display = 'block';
  }

  function renderError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('ticket-content').style.display = 'block';
    document.getElementById('root').innerHTML = `
      <div class="alert warn" style="text-align:center; padding:40px 24px;">
        <div style="font-size:2.5rem; margin-bottom:12px;">🎫</div>
        <h3 style="margin-bottom:8px;">${msg}</h3>
        <a href="/my-tickets.html" class="btn outline" style="margin-top:16px;">← My Tickets</a>
      </div>
    `;
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
  </script>
  <script src="/assets/js/chatbot.js"></script>
</body>
</html>
